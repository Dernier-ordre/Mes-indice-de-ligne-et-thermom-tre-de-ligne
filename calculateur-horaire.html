<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur TM - Réparé</title>
    <style>
        :root { --primary: #1e272e; --accent: #05c46b; --tm-blue: #3c40c6; --bg: #f1f2f6; --line-color: #3c40c6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .header-nav { 
            background: var(--primary); color: white; padding: 25px; border-radius: 15px; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; align-items: end;
            border-bottom: 5px solid var(--line-color);
            transition: border-color 0.5s;
        }

        .main-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .color-picker-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 8px; }
        input[type="color"] { width: 40px; height: 40px; border: none; background: none; cursor: pointer; }

        .tabs-header { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { border: none; background: #dfe4ea; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #57606f; }
        .tab-btn.active { background: var(--line-color); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .period-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid var(--line-color); margin-bottom: 15px; position: relative; }
        .period-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: #ff5e57; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }

        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-calc { background: var(--line-color); color: white; font-size: 1.1em; }

        table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th:first-child { position: sticky; left: 0; background: #f8f9fa !important; z-index: 10; border-right: 3px solid var(--line-color); color: var(--primary); text-align: left; min-width: 150px; }
        .course-head { background: var(--line-color); color: white; font-weight: bold; }
        .hf-zone { background: #fff9e6; font-style: italic; color: #d35400; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2 style="grid-column: 1/-1; margin:0 0 10px 0;">Configuration Réseau</h2>
        <div>
            <label style="color:white; font-size:0.8em;">Niveau</label>
            <select id="lvl-select" onchange="loadLines()">
                <option value="">-- Niv --</option>
                <option value="1">Niveau 1</option><option value="2">Niveau 2</option><option value="3">Niveau 3</option><option value="4">Niveau 4</option><option value="5">Niveau 5</option>
            </select>
        </div>
        <div>
            <label style="color:white; font-size:0.8em;">Ligne</label>
            <select id="line-select" onchange="applyLine()">
                <option value="">-- Choisir --</option>
            </select>
        </div>
        <div>
            <label style="color:white; font-size:0.8em;">Couleur Libre</label>
            <div class="color-picker-container">
                <input type="color" id="custom-color" oninput="applyManualColor(this.value)">
            </div>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Route</h3>
            <label>Temps A/R (min)</label><input type="number" id="totalTime" value="45">
            <label>Pause (min)</label><input type="number" id="breakTime" value="15">
            <label>Arrêts</label><input type="number" id="nbStops" value="5" oninput="uiStops()">
            <div id="stop-list" style="margin-top:10px;"></div>
        </div>

        <div class="card">
            <h3>Planification</h3>
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab(event, 'semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchTab(event, 'samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchTab(event, 'dimanche')">Dimanche</button>
            </div>
            
            <div id="tab-semaine" class="tab-content active">
                <div id="container-semaine"></div>
                <button class="btn" onclick="addPeriod('semaine')">+ Période Semaine</button>
            </div>
            <div id="tab-samedi" class="tab-content">
                <div id="container-samedi"></div>
                <button class="btn" onclick="addPeriod('samedi')">+ Période Samedi</button>
            </div>
            <div id="tab-dimanche" class="tab-content">
                <div id="container-dimanche"></div>
                <button class="btn" onclick="addPeriod('dimanche')">+ Période Dimanche</button>
            </div>

            <button class="btn btn-calc" onclick="generateAll()">Générer les Horaires</button>
        </div>
    </div>

    <div id="results" style="display:none; margin-top: 20px;">
        <div class="card">
            <div id="res-semaine"></div>
            <div id="res-samedi"></div>
            <div id="res-dimanche"></div>
        </div>
    </div>
</div>

<script>
// Logique simplifiée pour éviter les erreurs de duplication
function switchTab(e, day) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('tab-' + day).classList.add('active');
}

function addPeriod(day, s='06:00', e='22:00', b='4') {
    const cont = document.getElementById('container-' + day);
    const div = document.createElement('div');
    div.className = 'period-box';
    div.innerHTML = `
        <button class="btn-del" onclick="this.parentElement.remove()">×</button>
        <div class="period-grid">
            <div><label>Début</label><input type="time" class="p-start" value="${s}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${e}"></div>
            <div><label>Bus</label><input type="number" class="p-bus" value="${b}"></div>
        </div>`;
    cont.appendChild(div);
}

function applyManualColor(color) {
    document.documentElement.style.setProperty('--line-color', color);
}

function uiStops() {
    const n = document.getElementById('nbStops').value;
    const container = document.getElementById('stop-list');
    container.innerHTML = '';
    for(let i=1; i<=n; i++) {
        container.innerHTML += `<input type="text" class="stop-name" value="Arrêt ${i}" style="margin-bottom:5px;">`;
    }
}

// Initialisation propre : une seule période par conteneur spécifique
window.onload = () => { 
    uiStops();
    addPeriod('semaine'); 
    addPeriod('samedi'); 
    addPeriod('dimanche'); 
};

// ... (Reste des fonctions de calcul identiques à la version précédente)
</script>
</body>
</html>
