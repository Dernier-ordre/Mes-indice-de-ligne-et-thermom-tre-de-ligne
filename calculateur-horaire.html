<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Horaires - Transport Manager</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; color: #333; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        
        .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; background: #f8f9fa; padding: 20px; border-radius: 10px; }
        
        label { font-weight: bold; font-size: 0.9em; color: #555; display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* Zone des périodes dynamique */
        #periods-container { margin-bottom: 20px; }
        .period-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: end; }
        .btn-remove { background: #e74c3c; color: white; border: none; cursor: pointer; font-weight: bold; }
        
        .actions { display: flex; gap: 10px; }
        .btn-add { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-calc { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        
        /* Tableau de résultats */
        .result-area { margin-top: 40px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .headway-info { font-size: 0.8em; color: #777; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculateur de Ligne & Horaires</h1>

    <div class="control-panel">
        <div>
            <label>Temps total Aller-Retour (min)</label>
            <input type="number" id="totalTime" value="60" placeholder="Ex: 60">
        </div>
        <div>
            <label>Pause Conducteur / Battement (min)</label>
            <input type="number" id="breakTime" value="10" placeholder="Ex: 10">
            <small style="color:red; font-size:0.7em;">Indispensable pour le réalisme</small>
        </div>
        <div>
            <label>Nombre d'arrêts (Aller simple)</label>
            <input type="number" id="nbStops" value="10">
        </div>
    </div>

    <h3 style="color: var(--primary);">Définition des Plages Horaires</h3>
    <div id="periods-container">
        </div>

    <div class="actions">
        <button class="btn-add" onclick="addPeriodRow()">+ Ajouter une plage</button>
        <button class="btn-calc" onclick="generateSchedule()">CALCULER LA FICHE HORAIRE</button>
    </div>

    <div class="result-area">
        <h3 id="result-title" style="display:none;">Fiche Horaire (Direction Aller)</h3>
        <table id="schedule-table">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // Initialisation avec une ligne par défaut
    window.onload = function() {
        addPeriodRow('06:00', '09:00', 4); // Matin
        addPeriodRow('09:00', '16:00', 2); // Creuse
        addPeriodRow('16:00', '20:00', 5); // Soir
    };

    function addPeriodRow(startVal = '', endVal = '', busVal = '') {
        const div = document.createElement('div');
        div.className = 'period-row';
        div.innerHTML = `
            <div><label>Début</label><input type="time" class="p-start" value="${startVal}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${endVal}"></div>
            <div><label>Nb Véhicules</label><input type="number" class="p-bus" value="${busVal}" min="1"></div>
            <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('periods-container').appendChild(div);
    }

    function timeToMin(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function minToTime(minutes) {
        let h = Math.floor(minutes / 60);
        let m = Math.floor(minutes % 60);
        if (h >= 24) h -= 24; // Gestion après minuit
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function generateSchedule() {
        // 1. Récupération des données
        const totalTravelTime = parseInt(document.getElementById('totalTime').value); // Temps de roulage AR
        const breakTime = parseInt(document.getElementById('breakTime').value); // Temps de pause
        const nbStops = parseInt(document.getElementById('nbStops').value);
        
        // Cycle total = Temps de route + Pause
        const cycleTime = totalTravelTime + breakTime;

        // Temps moyen entre deux arrêts (Aller simple = Total/2)
        // On divise par (nbStops - 1) pour avoir le temps inter-station
        const oneWayTime = totalTravelTime / 2;
        const timeBetweenStops = oneWayTime / (nbStops - 1);

        // Récupération des périodes
        const rows = document.querySelectorAll('.period-row');
        let periods = [];
        rows.forEach(row => {
            periods.push({
                start: timeToMin(row.querySelector('.p-start').value),
                end: timeToMin(row.querySelector('.p-end').value),
                nbBus: parseInt(row.querySelector('.p-bus').value)
            });
        });

        // Trier les périodes par heure
        periods.sort((a, b) => a.start - b.start);

        // 2. Construction du tableau HTML
        const tableHead = document.querySelector('#schedule-table thead');
        const tableBody = document.querySelector('#schedule-table tbody');
        document.getElementById('result-title').style.display = 'block';

        // En-têtes (Arrêts)
        let headerHTML = '<tr><th>Départ Terminus</th>';
        for(let i=1; i < nbStops; i++) {
            headerHTML += `<th>Arrêt ${i+1}</th>`;
        }
        headerHTML += '</tr>';
        tableHead.innerHTML = headerHTML;
        tableBody.innerHTML = '';

        // 3. Calcul des départs
        // On commence à l'heure de début de la première période
        let currentTime = periods[0].start; 
        const endTimeOfDay = periods[periods.length - 1].end;

        while (currentTime < endTimeOfDay) {
            // Trouver dans quelle période on est
            let currentPeriod = periods.find(p => currentTime >= p.start && currentTime < p.end);
            
            // Si trou dans les horaires (ex: pause midi), on saute à la prochaine période
            if (!currentPeriod) {
                let nextPeriod = periods.find(p => p.start > currentTime);
                if(nextPeriod) {
                    currentTime = nextPeriod.start;
                    continue; 
                } else {
                    break; // Plus de période, fin de journée
                }
            }

            // CALCUL MAGIQUE : Fréquence = Cycle Total / Nombre de Bus
            let frequency = cycleTime / currentPeriod.nbBus;

            // Génération de la ligne du tableau
            let rowHTML = `<tr>`;
            
            // Calcul des horaires pour chaque arrêt de cette course
            for (let s = 0; s < nbStops; s++) {
                let passageTime = currentTime + (s * timeBetweenStops);
                rowHTML += `<td>${minToTime(passageTime)}</td>`;
            }
            rowHTML += `</tr>`;
            tableBody.innerHTML += rowHTML;

            // Incrémenter le temps pour le prochain bus
            currentTime += frequency;
        }
    }
</script>

</body>
</html>
