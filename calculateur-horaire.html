<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Horaire - Transport Manager</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #e67e22; --light: #f4f6f7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); }
        
        .panel { background: #eef2f3; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        
        label { font-weight: bold; font-size: 0.9em; color: #555; display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .period-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: end; background: white; padding: 10px; border-radius: 5px; }
        
        .btn-add { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-calc { background: var(--primary); color: white; border: none; font-size: 1.1em; padding: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-calc:hover { background: #1a252f; }
        
        /* Zone Résultats avec 2 colonnes */
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        @media (max-width: 900px) { .results-grid { grid-template-columns: 1fr; } }

        .table-container { overflow-x: auto; background: white; border: 1px solid #ddd; border-radius: 8px; }
        .table-header { padding: 10px; background: var(--primary); color: white; text-align: center; font-weight: bold; border-radius: 8px 8px 0 0; }
        .header-retour { background: var(--secondary); }

        table { width: 100%; border-collapse: collapse; font-size: 0.8em; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculateur Horaire (Aller / Retour)</h1>

    <div class="panel">
        <div class="grid-3">
            <div>
                <label>Temps Roulage Aller-Retour (min)</label>
                <input type="number" id="totalTime" value="50">
            </div>
            <div>
                <label>Pause Totale (min)</label>
                <input type="number" id="breakTime" value="10">
            </div>
            <div>
                <label>Nombre d'arrêts</label>
                <input type="number" id="nbStops" value="10">
            </div>
        </div>
        <p style="font-size: 0.85em; color: #666; margin-top: 5px;">
            * Le calcul suppose que la pause est répartie équitablement aux deux terminus.
        </p>
    </div>

    <div class="panel">
        <h3>Services / Périodes</h3>
        <div id="periods-container"></div>
        <button class="btn-add" onclick="addPeriodRow()">+ Ajouter une plage</button>
    </div>

    <button class="btn-calc" onclick="generateSchedule()">CALCULER LES HORAIRES</button>

    <div class="results-grid" id="results" style="display:none;">
        
        <div>
            <div class="table-header">Sens ALLER (Départ Terminus 1)</div>
            <div class="table-container">
                <table id="table-aller">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="table-header header-retour">Sens RETOUR (Départ Terminus 2)</div>
            <div class="table-container">
                <table id="table-retour">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    window.onload = function() {
        addPeriodRow('06:00', '22:00', 4);
    };

    function addPeriodRow(startVal = '', endVal = '', busVal = '') {
        const div = document.createElement('div');
        div.className = 'period-row';
        div.innerHTML = `
            <div><label>Début</label><input type="time" class="p-start" value="${startVal}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${endVal}"></div>
            <div><label>Nb Bus</label><input type="number" class="p-bus" value="${busVal}" min="1"></div>
            <button style="background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('periods-container').appendChild(div);
    }

    function timeToMin(timeStr) {
        if(!timeStr) return -1;
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    // Fonction qui gère l'affichage des heures > 24h (ex: 25h10 devient 01h10)
    function minToTime(minutes) {
        let h = Math.floor(minutes / 60);
        let m = Math.floor(minutes % 60);
        while (h >= 24) { h -= 24; } 
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function generateSchedule() {
        // 1. Inputs
        const totalTime = parseInt(document.getElementById('totalTime').value);
        const breakTime = parseInt(document.getElementById('breakTime').value);
        const nbStops = parseInt(document.getElementById('nbStops').value);
        
        if (isNaN(totalTime) || isNaN(breakTime)) return;

        const cycleTime = totalTime + breakTime;
        const oneWayDrive = totalTime / 2;
        const halfBreak = breakTime / 2; // Pause à chaque bout de ligne
        const timeBetweenStops = nbStops > 1 ? oneWayDrive / (nbStops - 1) : 0;
        
        // Décalage pour le départ retour : Temps Aller + Demi-Pause
        const returnOffset = oneWayDrive + halfBreak;

        // 2. Récupération Périodes
        let periods = [];
        document.querySelectorAll('.period-row').forEach(row => {
            let s = timeToMin(row.querySelector('.p-start').value);
            let e = timeToMin(row.querySelector('.p-end').value);
            let b = parseInt(row.querySelector('.p-bus').value);

            // GESTION NUIT : Si fin < début (ex: 22h -> 01h), on ajoute 24h à la fin
            if (e < s) e += 1440; 

            if (s !== -1 && e !== -1 && b > 0) periods.push({ start: s, end: e, nbBus: b });
        });

        periods.sort((a, b) => a.start - b.start);

        // 3. Préparation Tableaux
        const theadAller = document.querySelector('#table-aller thead');
        const tbodyAller = document.querySelector('#table-aller tbody');
        const theadRetour = document.querySelector('#table-retour thead');
        const tbodyRetour = document.querySelector('#table-retour tbody');

        // Headers
        let hAller = '<tr>';
        let hRetour = '<tr>';
        for(let i=1; i<=nbStops; i++) {
            hAller += `<th>Arrêt ${i}</th>`;
            hRetour += `<th>Arrêt ${nbStops - i + 1}</th>`; // Inverse les numéros pour le retour
        }
        hAller += '</tr>'; hRetour += '</tr>';
        
        theadAller.innerHTML = hAller;
        theadRetour.innerHTML = hRetour;
        tbodyAller.innerHTML = '';
        tbodyRetour.innerHTML = '';

        // 4. BOUCLE PRINCIPALE
        let currentTime = periods[0].start;
        const endTimeOfDay = periods[periods.length - 1].end;
        let safety = 0;

        while (currentTime < endTimeOfDay && safety < 1000) {
            // Trouver la période active
            let period = periods.find(p => currentTime >= p.start && currentTime < p.end);

            if (!period) {
                // Saut au prochain créneau si trou
                let next = periods.find(p => p.start > currentTime);
                if (next) { currentTime = next.start; continue; }
                else { break; }
            }

            let frequency = cycleTime / period.nbBus;

            // --- GÉNÉRATION LIGNE ALLER ---
            let rowAller = '<tr>';
            for (let s = 0; s < nbStops; s++) {
                let t = Math.round(currentTime + (s * timeBetweenStops));
                rowAller += `<td>${minToTime(t)}</td>`;
            }
            rowAller += '</tr>';
            tbodyAller.innerHTML += rowAller;

            // --- GÉNÉRATION LIGNE RETOUR (Liée à l'Aller) ---
            // Le bus arrive au terminus, fait sa pause, et repart
            let startRetour = currentTime + returnOffset;
            
            let rowRetour = '<tr>';
            for (let s = 0; s < nbStops; s++) {
                let t = Math.round(startRetour + (s * timeBetweenStops));
                rowRetour += `<td>${minToTime(t)}</td>`;
            }
            rowRetour += '</tr>';
            tbodyRetour.innerHTML += rowRetour;

            // Incrément
            currentTime += frequency;
            safety++;
        }

        document.getElementById('results').style.display = 'grid';
    }
</script>

</body>
</html>
