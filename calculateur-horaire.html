<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Grilles Horaires</title>
    <style>
        :root { --aller: #2c3e50; --retour: #d35400; --bg: #f5f6fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #2f3640; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Configuration */
        .config-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; }
        
        .period-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; background: white; padding: 10px; border-radius: 6px; align-items: end; }
        .btn-add { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-calc { background: #2f3640; color: white; border: none; padding: 15px; font-size: 1.1em; cursor: pointer; margin-top: 15px; font-weight: bold; }

        /* Tableaux */
        .schedule-section { margin-top: 40px; }
        .table-title { padding: 12px; color: white; font-weight: bold; border-radius: 8px 8px 0 0; margin: 0; }
        .title-aller { background: var(--aller); }
        .title-retour { background: var(--retour); }

        .table-wrapper { overflow-x: auto; border: 1px solid #dcdde1; border-radius: 0 0 8px 8px; background: white; margin-bottom: 30px; }
        table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        
        /* LA COLONNE DE GAUCHE (ARRÊTS) FIXE */
        td:first-child, th:first-child { 
            position: sticky; 
            left: 0; 
            background: #f8f9fa; 
            font-weight: bold; 
            z-index: 10; 
            border-right: 2px solid #2f3640; 
            min-width: 140px; 
            text-align: left;
            padding-left: 15px;
        }
        
        th, td { border: 1px solid #dcdde1; padding: 12px; text-align: center; min-width: 85px; }
        th { background: #f1f2f6; }
        tr:hover td { background-color: #f1f2f6; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Calculateur de Fiches Horaires</h2>

    <div class="config-box">
        <div><label>Temps Aller-Retour (min)</label><input type="number" id="totalTime" value="50"></div>
        <div><label>Pause Conducteur Totale (min)</label><input type="number" id="breakTime" value="10"></div>
        <div><label>Nombre d'arrêts (Aller)</label><input type="number" id="nbStops" value="10"></div>
    </div>

    <div style="background:#f1f2f6; padding:20px; border-radius:10px;">
        <label>Configuration des Services (Véhicules par période)</label>
        <div id="periods-container"></div>
        <button class="btn-add" onclick="addPeriod()">+ Ajouter une période</button>
    </div>

    <button class="btn-calc" onclick="calculate()">GÉNÉRER LES GRILLES ALLER ET RETOUR</button>

    <div id="results" style="display:none;">
        <div class="schedule-section">
            <h3 class="table-title title-aller">SENS ALLER (Terminus A → Terminus B)</h3>
            <div class="table-wrapper"><table id="table-aller"></table></div>
        </div>

        <div class="schedule-section">
            <h3 class="table-title title-retour">SENS RETOUR (Terminus B → Terminus A)</h3>
            <div class="table-wrapper"><table id="table-retour"></table></div>
        </div>
    </div>
</div>

<script>
    window.onload = function() { addPeriod('06:00', '22:00', 4); };

    function addPeriod(s='', e='', b='') {
        const div = document.createElement('div');
        div.className = 'period-row';
        div.innerHTML = `
            <div><label>Début</label><input type="time" class="p-start" value="${s}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${e}"></div>
            <div><label>Bus</label><input type="number" class="p-bus" value="${b}"></div>
            <button style="background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('periods-container').appendChild(div);
    }

    function toMin(str) {
        const [h, m] = str.split(':').map(Number);
        return h * 60 + m;
    }

    function toStr(min) {
        let h = Math.floor(min / 60) % 24;
        let m = Math.floor(min % 60);
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function calculate() {
        const arTime = parseInt(document.getElementById('totalTime').value);
        const pause = parseInt(document.getElementById('breakTime').value);
        const nStops = parseInt(document.getElementById('nbStops').value);
        
        const cycle = arTime + pause;
        const oneWay = arTime / 2;
        const stopInterval = oneWay / (nStops - 1);
        const returnStartOffset = oneWay + (pause / 2); // Départ retour après trajet + demi-pause

        let periods = [];
        document.querySelectorAll('.period-row').forEach(row => {
            let s = toMin(row.querySelector('.p-start').value);
            let e = toMin(row.querySelector('.p-end').value);
            let b = parseInt(row.querySelector('.p-bus').value);
            if (e <= s) e += 1440; // Gestion minuit
            if (b > 0) periods.push({s, e, b});
        });
        periods.sort((a,b) => a.s - b.s);

        const buildTable = (isRetour) => {
            let table = [];
            // Créer les lignes pour chaque arrêt
            for(let i=0; i<nStops; i++) {
                let name = isRetour ? `Arrêt ${nStops - i}` : `Arrêt ${i + 1}`;
                table[i] = `<tr><td>${name}</td>`;
            }

            let header = `<tr><th>Arrêts</th>`;
            let time = periods[0].s;
            let end = periods[periods.length - 1].e;
            let c = 1;

            while(time < end) {
                let p = periods.find(p => time >= p.s && time < p.e);
                if(!p) {
                    let next = periods.find(p => p.s > time);
                    if(next) { time = next.s; continue; } else break;
                }

                header += `<th>C${c}</th>`;
                let baseTime = isRetour ? time + returnStartOffset : time;

                for(let i=0; i<nStops; i++) {
                    table[i] += `<td>${toStr(Math.round(baseTime + (i * stopInterval)))}</td>`;
                }

                time += (cycle / p.b);
                c++;
            }
            return `<thead>${header}</tr></thead><tbody>${table.join('</tr>')}</tbody>`;
        };

        document.getElementById('table-aller').innerHTML = buildTable(false);
        document.getElementById('table-retour').innerHTML = buildTable(true);
        document.getElementById('results').style.display = 'block';
    }
</script>
</body>
</html>
