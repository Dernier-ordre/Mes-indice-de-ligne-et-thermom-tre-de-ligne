<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créateur de fiche horaire</title>
    <style>
        :root { --primary: #1e272e; --accent: #05c46b; --tm-blue: #3c40c6; --bg: #f1f2f6; --line-color: #3c40c6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .header-nav { 
            background: var(--primary); color: white; padding: 25px; border-radius: 15px; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px; align-items: end;
            border-bottom: 5px solid var(--line-color); transition: border-color 0.5s;
        }
        .header-nav h2 { margin: 0; grid-column: 1 / -1; color: white; font-size: 1.5em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

        .main-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid var(--bg); font-size: 1.1em; color: var(--primary); }

        label { display: block; font-size: 0.85em; font-weight: bold; margin: 10px 0 5px; color: #485460; }
        select, input[type="text"], input[type="number"], input[type="time"] { 
            width: 100%; padding: 12px; border: 2px solid #efefef; border-radius: 8px; box-sizing: border-box; font-size: 1em; 
        }
        select:focus, input:focus { border-color: var(--line-color); outline: none; }
        
        .color-picker-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 8px; }
        input[type="color"] { width: 50px; height: 40px; padding: 2px; cursor: pointer; border: none; background: none; }
        #line-select { border-width: 3px; font-weight: bold; color: var(--primary); transition: 0.3s; }

        .stops-list { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 400px; overflow-y: auto; margin-top: 10px; padding: 5px; background: #f9f9f9; border-radius: 8px; }
        .stop-item { display: flex; align-items: center; gap: 5px; }

        .tabs-header { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { border: none; background: #dfe4ea; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #57606f; transition: 0.3s; }
        .tab-btn.active { background: var(--line-color); color: white; transform: scale(1.05); }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        .period-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid var(--line-color); margin-bottom: 15px; position: relative; }
        .period-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; width: 100%; margin-top: 10px; }
        .btn-calc { background: var(--line-color); color: white; font-size: 1.1em; margin-top: 20px; }
        .btn-add { background: #ced6e0; color: #2f3542; }

        .table-container { overflow-x: auto; background: white; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; min-width: 80px; }
        th:first-child { position: sticky; left: 0; background: #f8f9fa !important; z-index: 10; border-right: 3px solid var(--line-color); color: var(--primary) !important; text-align: left; min-width: 160px; }
        td:first-child { position: sticky; left: 0; background: #f8f9fa; z-index: 10; border-right: 3px solid var(--line-color); text-align: left; }
        
        .course-head { background: var(--line-color) !important; color: white !important; font-weight: bold; }
        .hf-zone { background: #fff9e6; font-style: italic; color: #d35400; font-weight: bold; }
        .course-info { display: flex; flex-direction: column; font-size: 0.85em; }
        .badge-int { font-size:0.8em; opacity:0.8; font-weight:normal; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2>Configuration Réseau</h2>
        
        <div>
            <label style="color:white;">Nom du Réseau</label>
            <input type="text" id="network-name" placeholder="Ex: TCL, RATP..." oninput="saveNetworkName()">
        </div>

        <div>
            <label style="color:white;">Niveau</label>
            <select id="lvl-select" onchange="loadLines()">
                <option value="">-- Niv --</option>
                <option value="1">Niveau 1</option><option value="2">Niveau 2</option><option value="3">Niveau 3</option><option value="4">Niveau 4</option><option value="5">Niveau 5</option>
            </select>
        </div>
        <div>
            <label style="color:white;">Ligne</label>
            <select id="line-select" onchange="applyLine()">
                <option value="">-- Choisir --</option>
            </select>
        </div>
        <div>
            <label style="color:white;">Couleur Perso</label>
            <div class="color-picker-container">
                <input type="color" id="custom-color" oninput="applyManualColor(this.value)">
                <span id="color-hex" style="font-size: 0.8em; font-family: monospace; color: white;">#3c40c6</span>
            </div>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Paramètres Route</h3>
            <label>Temps Aller-Retour (min)</label>
            <input type="number" id="totalTime" value="45">
            <label>Pause Terminus (Total min)</label>
            <input type="number" id="breakTime" value="15">
            <label>Nombre d'arrêts</label>
            <input type="number" id="nbStops" value="10" oninput="uiStops()">
            <label>Arrêts</label>
            <div id="stop-list" class="stops-list"></div>
        </div>

        <div class="card">
            <h3>Planification</h3>
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchInputTab(event, 'semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchInputTab(event, 'samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchInputTab(event, 'dimanche')">Dimanche</button>
            </div>
            
            <div id="input-semaine" class="tab-content active">
                <div id="container-semaine"></div>
                <button class="btn btn-add" onclick="addPeriod('semaine')">+ Ajouter Période Semaine</button>
            </div>
            <div id="input-samedi" class="tab-content">
                <div id="container-samedi"></div>
                <button class="btn btn-add" onclick="addPeriod('samedi')">+ Ajouter Période Samedi</button>
            </div>
            <div id="input-dimanche" class="tab-content">
                <div id="container-dimanche"></div>
                <button class="btn btn-add" onclick="addPeriod('dimanche')">+ Ajouter Période Dimanche</button>
            </div>

            <button class="btn btn-calc" onclick="generateAll()">Générer les Horaires</button>
        </div>
    </div>

    <div id="results" style="display:none; margin-top: 30px;">
        <div class="card">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchResultTab(event, 'res-semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchResultTab(event, 'res-samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchResultTab(event, 'res-dimanche')">Dimanche</button>
            </div>
            <div id="res-semaine" class="result-tab active"></div>
            <div id="res-samedi" class="result-tab" style="display:none"></div>
            <div id="res-dimanche" class="result-tab" style="display:none"></div>
            <button class="btn" style="background:#2ecc71; color:white; margin-top:15px;" onclick="exportExcel()">📥 Tout Exporter (Excel)</button>
        </div>
    </div>
</div>

// --- LOGIQUE SAUVEGARDE NOM RÉSEAU ---
function saveNetworkName() {
    localStorage.setItem('tm_network_name', document.getElementById('network-name').value);
}

function applyLineColor(color) {
    document.documentElement.style.setProperty('--line-color', color);
    document.getElementById('custom-color').value = color;
    document.getElementById('color-hex').innerText = color.toUpperCase();
}

function applyManualColor(color) {
    document.documentElement.style.setProperty('--line-color', color);
    document.getElementById('color-hex').innerText = color.toUpperCase();
}

function loadLines() {
    const lvl = document.getElementById('lvl-select').value;
    const lSel = document.getElementById('line-select');
    lSel.innerHTML = '<option value="">-- Choisir --</option>';
    if(tmData[lvl]) {
        tmData[lvl].forEach((l, index) => {
            lSel.innerHTML += `<option value="${index}">${l.n}</option>`;
        });
    }
}

function applyLine() {
    const lvl = document.getElementById('lvl-select').value;
    const idx = document.getElementById('line-select').value;
    if(idx !== "" && tmData[lvl][idx]) {
        const line = tmData[lvl][idx];
        document.getElementById('totalTime').value = line.t;
        document.getElementById('nbStops').value = line.s;
        applyLineColor(line.c);
        
        // Configuration automatique des arrêts
        uiStops(line.map);
    }
}

function uiStops(stopMap = null) {
    const n = parseInt(document.getElementById('nbStops').value);
    const container = document.getElementById('stop-list');
    
    // On vérifie s'il y a déjà des noms saisis
    let existing = Array.from(document.querySelectorAll('.stop-name')).map(i=>i.value);
    
    container.innerHTML = '';
    for(let i=1; i<=n; i++) {
        let val = `Arrêt ${i}`;
        
        // Logique : Priorité au mapping officiel, sinon conservation de la saisie utilisateur
        if(stopMap && stopMap[i]) val = stopMap[i];
        else if(existing[i-1] && !stopMap) val = existing[i-1];

        container.innerHTML += `<div class="stop-item"><span>${i}.</span><input type="text" class="stop-name" value="${val}"></div>`;
    }
}

function switchInputTab(e, day) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('input-'+day).classList.add('active');
}

function switchResultTab(e, id) {
    document.querySelectorAll('#results .tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.querySelectorAll('.result-tab').forEach(c => c.style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

function addPeriod(day, s='06:00', e='22:00', b='4') {
    const cont = document.getElementById('container-' + day);
    const div = document.createElement('div');
    div.className = 'period-box';
    div.innerHTML = `<button style="position:absolute; right:5px; top:5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:12px;" onclick="this.parentElement.remove()">×</button>
        <div class="period-grid">
            <div><label>Début</label><input type="time" class="p-start" value="${s}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${e}"></div>
            <div><label>Bus</label><input type="number" class="p-bus" value="${b}"></div>
        </div>`;
    cont.appendChild(div);
}

function timeToMin(s) { if(!s) return 0; const [h,m] = s.split(':').map(Number); return h*60+m; }
function minToTime(m) { let h = Math.floor(m/60)%24, min = Math.floor(m%60); return `${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`; }

function generateAll() {
    ['semaine', 'samedi', 'dimanche'].forEach(day => {
        document.getElementById('res-' + day).innerHTML = generateTableForDay(day);
    });
    document.getElementById('results').style.display = 'block';
}

function generateTableForDay(dayId) {
    const periodsElements = document.getElementById('container-' + dayId).querySelectorAll('.period-box');
    if(periodsElements.length === 0) return "<p style='text-align:center; padding:20px;'>Aucune donnée pour ce jour.</p>";
    
    const arTime = parseInt(document.getElementById('totalTime').value);
    const pause = parseInt(document.getElementById('breakTime').value);
    const nbStops = parseInt(document.getElementById('nbStops').value);
    const stopNames = Array.from(document.querySelectorAll('.stop-name')).map(i => i.value);
    const cycle = arTime + pause, oneWay = arTime / 2, gap = oneWay / (nbStops - 1), returnDelay = oneWay + (pause / 2);
    
    let periods = [];
    periodsElements.forEach(p => {
        let s = timeToMin(p.querySelector('.p-start').value), e = timeToMin(p.querySelector('.p-end').value), b = parseInt(p.querySelector('.p-bus').value);
        if(e <= s) e += 1440; if(b > 0) periods.push({s, e, b, freq: cycle/b});
    });
    periods.sort((a,b) => a.s - b.s);

    const makeTable = (isRetour) => {
        let allTrips = [];
        let cur = periods[0].s, end = periods[periods.length-1].e, count = 1;
        while(cur < end) {
            let p = periods.find(p => cur >= p.s && cur < p.e);
            if(!p) { let next = periods.find(p => p.s > cur); if(next) cur = next.s; else break; p = next; }
            allTrips.push({ id: count, time: cur, freq: p.freq });
            cur += p.freq; count++;
        }

        let renderGroups = [];
        allTrips.forEach(trip => {
            let lastGroup = renderGroups[renderGroups.length - 1];
            if(trip.freq <= 6) {
                if(lastGroup && lastGroup.type === 'HF' && Math.round(lastGroup.freq) === Math.round(trip.freq)) {
                    lastGroup.trips.push(trip);
                } else {
                    renderGroups.push({ type: 'HF', freq: trip.freq, trips: [trip] });
                }
            } else {
                renderGroups.push({ type: 'NORM', trip: trip });
            }
        });

        let rows = Array(nbStops).fill("");
        for(let i=0; i<nbStops; i++) rows[i] = `<tr><td>${isRetour ? stopNames[nbStops-1-i] : stopNames[i]}</td>`;
        let header = `<tr><th>Arrêts/course</th>`;

        renderGroups.forEach(group => {
            if(group.type === 'NORM') {
                header += `<th class="course-head">D${group.trip.id}<div class="badge-int">${Math.round(group.trip.freq)}m</div></th>`;
                let base = isRetour ? group.trip.time + returnDelay : group.trip.time;
                for(let i=0; i<nbStops; i++) rows[i] += `<td>${minToTime(Math.round(base + (i*gap)))}</td>`;
            } else {
                let startT = minToTime(group.trips[0].time);
                let lastTrip = group.trips[group.trips.length-1];
                let endT = minToTime(lastTrip.time + group.freq);
                header += `<th class="course-head">C${group.trips[0].id} - D${lastTrip.id}</th>`;
                for(let i=0; i<nbStops; i++) {
                    rows[i] += `<td class="hf-zone">De ${startT} à ${endT}<br>Toutes les ${Math.round(group.freq)} min</td>`;
                }
            }
        });
        return `<table><thead>${header}</thead><tbody>${rows.join('</tr>')}</tbody></table>`;
    };

    return `<h4>Aller</h4><div class="table-container">${makeTable(false)}</div><h4>Retour</h4><div class="table-container">${makeTable(true)}</div>`;
}

function exportExcel() {
    const netName = document.getElementById('network-name').value || "Réseau";
    let content = `<html><head><meta charset="UTF-8"></head><body>
        <h1>Horaires - ${netName}</h1>
        <h2>Semaine</h2>${document.getElementById('res-semaine').innerHTML}
        <br><hr><br>
        <h2>Samedi</h2>${document.getElementById('res-samedi').innerHTML}
        <br><hr><br>
        <h2>Dimanche</h2>${document.getElementById('res-dimanche').innerHTML}
        </body></html>`;
    let url = URL.createObjectURL(new Blob([content], {type: 'application/vnd.ms-excel'}));
    let a = document.createElement('a'); a.href = url; a.download = `Horaires_${netName}.xls`; a.click();
}

window.onload = () => { 
    uiStops(); 
    ['semaine', 'samedi', 'dimanche'].forEach(d => document.getElementById('container-'+d).innerHTML = '');
    addPeriod('semaine', '06:00', '9:30', '4');
    addPeriod('samedi', '07:00', '9:30', '2');
    addPeriod('dimanche', '08:00', '9:30', '1');
    const savedName = localStorage.getItem('tm_network_name');
    if(savedName) document.getElementById('network-name').value = savedName;
};
