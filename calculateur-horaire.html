<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur TM - Multi-Jours</title>
    <style>
        :root { --primary: #1e272e; --accent: #05c46b; --tm-blue: #3c40c6; --bg: #f1f2f6; --line-color: #3c40c6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* HEADER & NAVIGATION */
        .header-nav { 
            background: var(--primary); color: white; padding: 25px; border-radius: 15px; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: end;
            border-bottom: 5px solid var(--line-color); /* Ligne colorée en bas */
            transition: border-color 0.5s;
        }
        .header-nav h2 { margin: 0; grid-column: 1 / -1; color: white; font-size: 1.5em; text-transform: uppercase; letter-spacing: 1px; }

        /* GRID PRINCIPALE */
        .main-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid var(--bg); font-size: 1.1em; color: var(--primary); }

        /* INPUTS & SELECTS */
        label { display: block; font-size: 0.85em; font-weight: bold; margin: 10px 0 5px; color: #485460; }
        select, input { width: 100%; padding: 12px; border: 2px solid #efefef; border-radius: 8px; box-sizing: border-box; font-size: 1em; }
        select:focus, input:focus { border-color: var(--line-color); outline: none; }
        
        /* Le select de la ligne change de couleur */
        #line-select { border-width: 3px; font-weight: bold; color: var(--primary); transition: 0.3s; }

        /* LISTE DES ARRÊTS */
        .stops-list { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 400px; overflow-y: auto; margin-top: 10px; padding: 5px; background: #f9f9f9; border-radius: 8px; }
        .stop-item { display: flex; align-items: center; gap: 5px; }
        .stop-item span { font-size: 0.8em; color: #888; min-width: 25px; }

        /* ONGLETS (TABS) pour Jours */
        .tabs-header { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { 
            border: none; background: #dfe4ea; padding: 10px 20px; border-radius: 20px; 
            cursor: pointer; font-weight: bold; color: #57606f; transition: 0.3s; 
        }
        .tab-btn.active { background: var(--line-color); color: white; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        /* PERIOD BOXES */
        .period-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid var(--line-color); margin-bottom: 15px; position: relative; transition: border-color 0.5s; }
        .period-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: #ff5e57; color: white; border: none; border-radius: 50%; cursor: pointer; width: 22px; height: 22px; }

        /* BOUTONS D'ACTION */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; flex: 1; text-transform: uppercase; }
        .btn-calc { background: var(--line-color); color: white; font-size: 1.1em; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: background 0.5s; }
        .btn-add { background: #ced6e0; color: #2f3542; margin-top: 10px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* TABLEAUX RÉSULTATS */
        .table-container { overflow-x: auto; background: white; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; min-width: 80px; }
        th:first-child, td:first-child { position: sticky; left: 0; background: #f8f9fa; z-index: 10; border-right: 3px solid var(--line-color); min-width: 160px; text-align: left; transition: border-color 0.5s; }
        th { background: var(--primary); color: white; }
        
        .course-info { display: flex; flex-direction: column; font-size: 0.75em; }
        .badge-vh { background: #ffa801; color: #000; padding: 2px 4px; border-radius: 4px; font-weight: bold; margin: 3px 0; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2>Configuration Avancée</h2>
        <div>
            <label style="color:white;">1. Niveau</label>
            <select id="lvl-select" onchange="loadLines()">
                <option value="">-- Niv --</option>
                <option value="1">Niveau 1</option>
                <option value="2">Niveau 2</option>
                <option value="3">Niveau 3</option>
                <option value="4">Niveau 4</option>
                <option value="5">Niveau 5</option>
            </select>
        </div>
        <div>
            <label style="color:white;">2. Ligne</label>
            <select id="line-select" onchange="applyLine()">
                <option value="">-- Choisir --</option>
            </select>
        </div>
        <div style="font-size: 0.8em; color: #ccc;">
            ℹ️ Sélectionne la ligne pour appliquer sa couleur et ses arrêts.
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Paramètres Route</h3>
            <label>Temps Aller-Retour (min)</label>
            <input type="number" id="totalTime" value="45">
            
            <label>Pause Terminus (Total min)</label>
            <input type="number" id="breakTime" value="15">
            
            <label>Nombre d'arrêts</label>
            <input type="number" id="nbStops" value="10" oninput="uiStops()">

            <label>Nommer vos arrêts</label>
            <div id="stop-list" class="stops-list"></div>
        </div>

        <div class="card">
            <h3>Planification des Services</h3>
            
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchInputTab('semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchInputTab('samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchInputTab('dimanche')">Dimanche</button>
            </div>

            <div id="input-semaine" class="tab-content active">
                <div id="container-semaine"></div>
                <button class="btn btn-add" onclick="addPeriod('semaine')">+ Ajouter plage (Semaine)</button>
            </div>

            <div id="input-samedi" class="tab-content">
                <div id="container-samedi"></div>
                <button class="btn btn-add" onclick="addPeriod('samedi')">+ Ajouter plage (Samedi)</button>
            </div>

            <div id="input-dimanche" class="tab-content">
                <div id="container-dimanche"></div>
                <button class="btn btn-add" onclick="addPeriod('dimanche')">+ Ajouter plage (Dimanche)</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-calc" onclick="generateAll()">Générer les 3 Horaires</button>
            </div>
        </div>
    </div>

    <div id="results" style="display:none; margin-top: 30px;">
        <div class="card">
            <h3>Fiches Horaires Générées</h3>
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchResultTab('res-semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchResultTab('res-samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchResultTab('res-dimanche')">Dimanche</button>
            </div>

            <div id="res-semaine" class="result-tab active"></div>
            <div id="res-samedi" class="result-tab" style="display:none"></div>
            <div id="res-dimanche" class="result-tab" style="display:none"></div>
            
            <button class="btn" style="background:#2ecc71; color:white; margin-top:15px;" onclick="exportExcel()">📥 Tout Exporter (Excel)</button>
        </div>
    </div>
</div>

// --- LOGIQUE COULEURS (FIXE) ---
function applyLineColor(color) {
    // Applique la couleur définie dans tmData au thème
    document.documentElement.style.setProperty('--line-color', color);
    
    // Change aussi la bordure du select pour un rappel visuel
    document.getElementById('line-select').style.borderColor = color;
}

// --- INITIALISATION & UI ---
function loadLines() {
    const lvl = document.getElementById('lvl-select').value;
    const lSel = document.getElementById('line-select');
    lSel.innerHTML = '<option value="">-- Choisir une ligne --</option>';
    if(tmData[lvl]) {
        tmData[lvl].forEach((l, index) => {
            lSel.innerHTML += `<option value="${index}">${l.n}</option>`;
        });
    }
}

function applyLine() {
    const lvl = document.getElementById('lvl-select').value;
    const idx = document.getElementById('line-select').value;
    
    if(idx !== "" && tmData[lvl][idx]) {
        const line = tmData[lvl][idx];
        document.getElementById('totalTime').value = line.t;
        document.getElementById('nbStops').value = line.s;
        
        // On applique la couleur FIXE définie dans l'objet de la ligne
        applyLineColor(line.c);
        
        uiStops(); 
    }
}

function uiStops() {
    const n = document.getElementById('nbStops').value;
    const container = document.getElementById('stop-list');
    
    // Sauvegarde des noms existants si possible
    let existing = Array.from(document.querySelectorAll('.stop-name')).map(i=>i.value);
    
    container.innerHTML = '';
    for(let i=1; i<=n; i++) {
        let val = existing[i-1] ? existing[i-1] : `Arrêt ${i}`;
        container.innerHTML += `
            <div class="stop-item">
                <span>${i}.</span>
                <input type="text" class="stop-name" value="${val}">
            </div>`;
    }
}

// --- GESTION DES ONGLETS ---
function switchInputTab(day) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('input-'+day).classList.add('active');
}

function switchResultTab(id) {
    document.querySelectorAll('#results .tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    document.querySelectorAll('.result-tab').forEach(c => c.style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

// --- AJOUT DE PÉRIODES ---
function addPeriod(dayContainerId, s='', e='', b='') {
    const cont = document.getElementById('container-' + dayContainerId);
    const div = document.createElement('div');
    div.className = 'period-box';
    div.innerHTML = `
        <button class="btn-del" onclick="this.parentElement.remove()">×</button>
        <div class="period-grid">
            <div><label>Début</label><input type="time" class="p-start" value="${s}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${e}"></div>
            <div><label>Bus</label><input type="number" class="p-bus" value="${b}"></div>
        </div>
    `;
    cont.appendChild(div);
}

// --- MOTEUR DE CALCUL ---
function timeToMin(s) { if(!s) return 0; const [h,m] = s.split(':').map(Number); return h*60+m; }
function minToTime(m) { 
    let h = Math.floor(m/60)%24; 
    let min = Math.floor(m%60); 
    return `${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`; 
}

function generateAll() {
    const days = ['semaine', 'samedi', 'dimanche'];
    let hasData = false;

    days.forEach(day => {
        const html = generateTableForDay(day);
        document.getElementById('res-' + day).innerHTML = html;
        if(html.length > 50) hasData = true; // Vérif simple
    });

    if(hasData) document.getElementById('results').style.display = 'block';
}

function generateTableForDay(dayId) {
    // 1. Récupérer les données
    const container = document.getElementById('container-' + dayId);
    const periodsElements = container.querySelectorAll('.period-box');
    
    if(periodsElements.length === 0) return `<p style="padding:20px; color:#999; text-align:center;">Aucune plage horaire configurée pour ${dayId}.</p>`;

    const arTime = parseInt(document.getElementById('totalTime').value);
    const pause = parseInt(document.getElementById('breakTime').value);
    const nbStops = parseInt(document.getElementById('nbStops').value);
    const stopNames = Array.from(document.querySelectorAll('.stop-name')).map(i => i.value);

    const cycle = arTime + pause;
    const oneWay = arTime / 2;
    const gap = nbStops > 1 ? oneWay / (nbStops - 1) : 0;
    const returnDelay = oneWay + (pause / 2);

    let periods = [];
    periodsElements.forEach(p => {
        let s = timeToMin(p.querySelector('.p-start').value);
        let e = timeToMin(p.querySelector('.p-end').value);
        let b = parseInt(p.querySelector('.p-bus').value);
        if(e <= s) e += 1440;
        if(b > 0) periods.push({s, e, b});
    });
    periods.sort((a,b) => a.s - b.s);

    if(periods.length === 0) return "";

    // 2. Fonction constructeur de table
    const makeTable = (isRetour) => {
        let rows = [];
        for(let i=0; i<nbStops; i++) {
            let name = isRetour ? stopNames[nbStops-1-i] : stopNames[i];
            rows[i] = `<tr><td>${name}</td>`;
        }

        let header = `<tr><th style="color:white">Arrêts (${dayId})</th>`;
        let cur = periods[0].s;
        let end = periods[periods.length-1].e;
        let count = 1;

        while(cur < end) {
            let p = periods.find(p => cur >= p.s && cur < p.e);
            if(!p) {
                let next = periods.find(p => p.s > cur);
                if(next) { cur = next.s; continue; } else break;
            }

            let frequency = cycle / p.b;
            let vh = ((count-1) % p.b) + 1;

            header += `
                <th>
                    <div class="course-info">
                        <strong>D${count}</strong>
                    </div>
                </th>`;

            let base = isRetour ? cur + returnDelay : cur;
            for(let i=0; i<nbStops; i++) {
                rows[i] += `<td>${minToTime(Math.round(base + (i*gap)))}</td>`;
            }
            cur += frequency;
            count++;
        }
        return `<table class="gen-table">${header}</tr></thead><tbody>${rows.join('</tr>')}</tbody></table>`;
    };

    return `
        <h4 style="color:var(--line-color); margin-top:20px;">⬆ DIRECTION : ALLER</h4>
        <div class="table-container">${makeTable(false)}</div>
        <h4 style="color:#e67e22">⬇ DIRECTION : RETOUR</h4>
        <div class="table-container">${makeTable(true)}</div>
    `;
}

function exportExcel() {
    let content = `
        <html>
        <head><meta charset="UTF-8"></head>
        <body>
            <h1>Export Horaire TM</h1>
            <h2>Semaine</h2>
            ${document.getElementById('res-semaine').innerHTML}
            <br><hr><br>
            <h2>Samedi</h2>
            ${document.getElementById('res-samedi').innerHTML}
            <br><hr><br>
            <h2>Dimanche</h2>
            ${document.getElementById('res-dimanche').innerHTML}
        </body>
        </html>
    `;
    
    let blob = new Blob([content], {type: 'application/vnd.ms-excel'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'Horaires_Complets_TM.xls';
    a.click();
}

// Initialisation : Ajouter une période par défaut pour la semaine
window.onload = function() {
    addPeriod('semaine', '06:00', '22:00', '4');
}
</script>
