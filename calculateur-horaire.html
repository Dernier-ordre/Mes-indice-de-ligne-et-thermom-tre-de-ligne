<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur TM - PDF Compact & Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --primary: #1e272e; --accent: #05c46b; --tm-blue: #3c40c6; --bg: #f1f2f6; --line-color: #3c40c6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        .header-nav { 
            background: var(--primary); color: white; padding: 25px; border-radius: 15px; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 20px; align-items: end;
            border-bottom: 5px solid var(--line-color); transition: border-color 0.5s;
        }
        .header-nav h2 { margin: 0; grid-column: 1 / -1; color: white; font-size: 1.5em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

        .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid var(--bg); font-size: 1.1em; color: var(--primary); }

        label { display: block; font-size: 0.85em; font-weight: bold; margin: 10px 0 5px; color: #485460; }
        select, input { width: 100%; padding: 10px; border: 2px solid #efefef; border-radius: 8px; box-sizing: border-box; }
        
        .color-picker-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 8px; }
        input[type="color"] { width: 50px; height: 40px; padding: 2px; cursor: pointer; border: none; background: none; }

        .stops-list { max-height: 500px; overflow-y: auto; margin-top: 10px; background: #f9f9f9; border-radius: 8px; padding: 5px; }
        .stop-item { display: grid; grid-template-columns: 25px 1fr 90px; gap: 5px; align-items: center; margin-bottom: 5px; padding: 8px; background: white; border-bottom: 1px solid #eee; border-radius: 4px; }
        .stop-item span { font-size: 0.8em; color: #888; font-weight: bold; }
        .stop-item input { font-size: 0.9em; padding: 6px; }
        .stop-corres { border: 1px dashed #ccc !important; text-align: center; font-weight: bold; color: #555; }

        .tabs-header { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { border: none; background: #dfe4ea; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #57606f; transition: 0.3s; }
        .tab-btn.active { background: var(--line-color); color: white; transform: scale(1.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .period-box { background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid var(--line-color); margin-bottom: 10px; position: relative; }
        .period-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: #ff5e57; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; }

        .btn { border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .btn-calc { background: var(--line-color); color: white; font-size: 1em; }
        .btn-pdf { background: #e74c3c; color: white; font-size: 1.1em; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); margin-top: 15px; }
        .btn-txt { background: #34495e; color: white; font-size: 1em; margin-top: 10px; }
        .btn-add { background: #ced6e0; color: #2f3542; }

        .table-container { overflow-x: auto; background: white; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        table { border-collapse: collapse; width: 100%; font-size: 0.75em; }
        th, td { border: 1px solid #eee; padding: 6px; text-align: center; min-width: 50px; }
        th:first-child, td:first-child { position: sticky; left: 0; background: #f8f9fa; z-index: 10; border-right: 2px solid var(--line-color); text-align: left; min-width: 120px; }
        .course-head { background: var(--line-color); color: white; }
        .hf-zone { background: #fff9e6; font-style: italic; color: #d35400; font-weight: bold; }
        h4 { margin: 15px 0 5px 0; color: var(--primary); border-bottom: 2px solid #ddd; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h2>Configuration Complète</h2>
        <div><label style="color:white;">Nom du Réseau</label><input type="text" id="network-name" placeholder="Ex: TCL" oninput="saveNetworkName()"></div>
        <div><label style="color:white;">Niveau</label><select id="lvl-select" onchange="loadLines()"><option value="">-- Niv --</option><option value="1">Niveau 1</option><option value="2">Niveau 2</option><option value="3">Niveau 3</option><option value="4">Niveau 4</option><option value="5">Niveau 5</option></select></div>
        <div><label style="color:white;">Ligne</label><select id="line-select" onchange="applyLine()"><option value="">-- Choisir --</option></select></div>
        <div><label style="color:white;">Couleur</label><div class="color-picker-container"><input type="color" id="custom-color" oninput="applyManualColor(this.value)"></div></div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>1. Configuration Ligne</h3>
            <label>Temps Aller-Retour (min)</label><input type="number" id="totalTime" value="45">
            <label>Pause Terminus (min)</label><input type="number" id="breakTime" value="15">
            <label>Nombre d'arrêts</label><input type="number" id="nbStops" value="10" oninput="uiStops()">
            
            <label>Liste des Arrêts & Correspondances</label>
            <div style="font-size:0.75em; color:#666; margin-bottom:5px;">Col 1: Nom | Col 2: Correspondances (ex: "1, A, T1")</div>
            <div id="stop-list" class="stops-list"></div>
        </div>

        <div class="card">
            <h3>2. Grilles & Export</h3>
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchInputTab(event, 'semaine')">Semaine</button>
                <button class="tab-btn" onclick="switchInputTab(event, 'samedi')">Samedi</button>
                <button class="tab-btn" onclick="switchInputTab(event, 'dimanche')">Dimanche</button>
            </div>
            
            <div id="input-semaine" class="tab-content active"><div id="container-semaine"></div><button class="btn btn-add" onclick="addPeriod('semaine')">+ Période Semaine</button></div>
            <div id="input-samedi" class="tab-content"><div id="container-samedi"></div><button class="btn btn-add" onclick="addPeriod('samedi')">+ Période Samedi</button></div>
            <div id="input-dimanche" class="tab-content"><div id="container-dimanche"></div><button class="btn btn-add" onclick="addPeriod('dimanche')">+ Période Dimanche</button></div>

            <button class="btn btn-calc" onclick="generateAll()">Générer HTML (Aperçu)</button>
            
            <div style="margin-top:15px; padding:10px; background:#f1f2f6; border-radius:8px;">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="custom-icons-check"> Utiliser icônes perso (Placeholder)
                </label>
            </div>
            
            <button class="btn btn-pdf" onclick="generatePDF()">📄 TÉLÉCHARGER LE PDF</button>
            <button class="btn btn-txt" onclick="exportHTMLtoTXT()">💾 EXPORTER HTML (TXT)</button>
        </div>
    </div>

    <div id="results" style="display:none; margin-top: 30px;">
        <div class="card">
            <div id="res-semaine"></div><div id="res-samedi"></div><div id="res-dimanche"></div>
        </div>
    </div>
</div>

// --- LOGIQUE UI ---
function saveNetworkName() { localStorage.setItem('tm_network_name', document.getElementById('network-name').value); }
function applyLineColor(color) { document.documentElement.style.setProperty('--line-color', color); document.getElementById('custom-color').value = color; }
function applyManualColor(color) { document.documentElement.style.setProperty('--line-color', color); }

function loadLines() {
    const lvl = document.getElementById('lvl-select').value;
    const lSel = document.getElementById('line-select');
    lSel.innerHTML = '<option value="">-- Choisir --</option>';
    if(tmData[lvl]) tmData[lvl].forEach((l, index) => lSel.innerHTML += `<option value="${index}">${l.n}</option>`);
}

function applyLine() {
    const lvl = document.getElementById('lvl-select').value;
    const idx = document.getElementById('line-select').value;
    if(idx !== "" && tmData[lvl][idx]) {
        const line = tmData[lvl][idx];
        document.getElementById('totalTime').value = line.t;
        document.getElementById('nbStops').value = line.s;
        applyLineColor(line.c);
        uiStops(line.map);
    }
}

function uiStops(stopMap = null) {
    const n = parseInt(document.getElementById('nbStops').value);
    const container = document.getElementById('stop-list');
    let existingNames = Array.from(document.querySelectorAll('.stop-name')).map(i=>i.value);
    let existingCorres = Array.from(document.querySelectorAll('.stop-corres')).map(i=>i.value);
    
    container.innerHTML = '';
    for(let i=1; i<=n; i++) {
        let val = `Arrêt ${i}`;
        if(stopMap && stopMap[i]) val = stopMap[i];
        else if(existingNames[i-1] && !stopMap) val = existingNames[i-1];
        let corr = existingCorres[i-1] || "";

        container.innerHTML += `<div class="stop-item"><span>${i}.</span><input type="text" class="stop-name" value="${val}" placeholder="Nom de l'arrêt"><input type="text" class="stop-corres" value="${corr}" placeholder="Ex: 1, A, T1"></div>`;
    }
}

function switchInputTab(e, day) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.getElementById('input-'+day).classList.add('active'); }
function switchResultTab(e, id) { document.querySelectorAll('#results .tab-btn').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); document.querySelectorAll('.result-tab').forEach(c => c.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
function addPeriod(day, s='06:00', e='22:00', b='4') { const cont = document.getElementById('container-' + day); const div = document.createElement('div'); div.className = 'period-box'; div.innerHTML = `<button class="btn-del" onclick="this.parentElement.remove()">×</button><div class="period-grid"><div><label>Début</label><input type="time" class="p-start" value="${s}"></div><div><label>Fin</label><input type="time" class="p-end" value="${e}"></div><div><label>Bus</label><input type="number" class="p-bus" value="${b}"></div></div>`; cont.appendChild(div); }
function timeToMin(s) { if(!s) return 0; const [h,m] = s.split(':').map(Number); return h*60+m; }
function minToTime(m) { let h = Math.floor(m/60)%24, min = Math.floor(m%60); return `${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`; }

function generateAll() {
    ['semaine', 'samedi', 'dimanche'].forEach(day => {
        document.getElementById('res-' + day).innerHTML = generateTableForDay(day);
    });
    document.getElementById('results').style.display = 'block';
}

function generateTableForDay(dayId) {
    const periodsElements = document.getElementById('container-' + dayId).querySelectorAll('.period-box');
    if(periodsElements.length === 0) return "";
    
    const arTime = parseInt(document.getElementById('totalTime').value);
    const pause = parseInt(document.getElementById('breakTime').value);
    const nbStops = parseInt(document.getElementById('nbStops').value);
    const stopNames = Array.from(document.querySelectorAll('.stop-name')).map(i => i.value);
    const cycle = arTime + pause, oneWay = arTime / 2, gap = oneWay / (nbStops - 1), returnDelay = oneWay + (pause / 2);
    
    let periods = [];
    periodsElements.forEach(p => {
        let s = timeToMin(p.querySelector('.p-start').value), e = timeToMin(p.querySelector('.p-end').value), b = parseInt(p.querySelector('.p-bus').value);
        if(e <= s) e += 1440; if(b > 0) periods.push({s, e, b, freq: cycle/b});
    });
    periods.sort((a,b) => a.s - b.s);

    const makeTable = (isRetour) => {
        let allTrips = [];
        let cur = periods[0].s, end = periods[periods.length-1].e, count = 1;
        while(cur < end) {
            let p = periods.find(p => cur >= p.s && cur < p.e);
            if(!p) { let next = periods.find(p => p.s > cur); if(next) cur = next.s; else break; p = next; }
            allTrips.push({ id: count, time: cur, freq: p.freq });
            cur += p.freq; count++;
        }

        // CHUNK 15 FOR PDF
        const CHUNK_SIZE = 15;
        let htmlOutput = "";
        
        for (let i = 0; i < allTrips.length; i += CHUNK_SIZE) {
            let chunk = allTrips.slice(i, i + CHUNK_SIZE);
            let chunkIndex = Math.floor(i / CHUNK_SIZE) + 1;
            
            let renderGroups = [];
            chunk.forEach(trip => {
                let lastGroup = renderGroups[renderGroups.length - 1];
                if(trip.freq <= 6) {
                    if(lastGroup && lastGroup.type === 'HF' && Math.round(lastGroup.freq) === Math.round(trip.freq)) { lastGroup.trips.push(trip); } 
                    else { renderGroups.push({ type: 'HF', freq: trip.freq, trips: [trip] }); }
                } else { renderGroups.push({ type: 'NORM', trip: trip }); }
            });

            let rows = Array(nbStops).fill("");
            for(let j=0; j<nbStops; j++) rows[j] = `<tr><td>${isRetour ? stopNames[nbStops-1-j] : stopNames[j]}</td>`;
            let header = `<tr><th>Arrêts</th>`;
            
            renderGroups.forEach(group => {
                if(group.type === 'NORM') {
                    header += `<th class="course-head">C${group.trip.id}</th>`;
                    let base = isRetour ? group.trip.time + returnDelay : group.trip.time;
                    for(let j=0; j<nbStops; j++) rows[j] += `<td>${minToTime(Math.round(base + (j*gap)))}</td>`;
                } else {
                    let startT = minToTime(group.trips[0].time);
                    let lastTrip = group.trips[group.trips.length-1];
                    let endT = minToTime(lastTrip.time + group.freq);
                    header += `<th class="course-head">C${group.trips[0].id}-${lastTrip.id}</th>`;
                    for(let j=0; j<nbStops; j++) rows[j] += `<td class="hf-zone">De ${startT} à ${endT}<br>${Math.round(group.freq)} min</td>`;
                }
            });

            htmlOutput += `<h4>${isRetour ? "Retour" : "Aller"} (Partie ${chunkIndex})</h4>`;
            htmlOutput += `<table><thead>${header}</thead><tbody>${rows.join('</tr>')}</tbody></table><br>`;
        }
        return htmlOutput;
    };
    return `<div class="direction-block">${makeTable(false)}</div><div class="direction-block">${makeTable(true)}</div>`;
}

// --- HELPER COULEUR CORRESPONDANCE ---
function getCorresColor(shortName) {
    for (let lvl in tmData) { for (let line of tmData[lvl]) { if (line.n === shortName || line.n === "Ligne " + shortName) return line.c; } }
    if(shortName === "A" || shortName === "B") return "#e84393"; 
    if(shortName.startsWith("T")) return "#e67e22"; 
    return "#505050"; 
}

// --- HEADER DU PDF ---
function drawHeader(doc, networkName, lineNameText, lineColor) {
    doc.setFillColor(lineColor);
    doc.rect(0, 0, 210, 18, 'F'); // REDUCED HEIGHT
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(15); // REDUCED FONT
    doc.setFont("helvetica", "bold");
    doc.text(networkName.toUpperCase(), 10, 12);
    doc.text(lineNameText, 200, 12, { align: 'right' });
}

// --- GENERATION PDF INTELLIGENTE ---
function generatePDF() {
    const doc = new jsPDF();
    const networkName = document.getElementById('network-name').value || "RESEAU";
    const lineColor = document.getElementById('custom-color').value;
    const lineNameText = document.getElementById('line-select').options[document.getElementById('line-select').selectedIndex].text;
    const useCustomIcons = document.getElementById('custom-icons-check').checked;

    drawHeader(doc, networkName, lineNameText, lineColor);

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(16);
    doc.text("Plan de la ligne", 10, 35); // REMONTÉ

    const stops = Array.from(document.querySelectorAll('.stop-name')).map(i => i.value);
    const corres = Array.from(document.querySelectorAll('.stop-corres')).map(i => i.value);
    
    let xLine = 20;
    let startY = 45; // REMONTÉ
    let availableHeight = 230; // PLUS DE PLACE
    let gap = 14; 
    
    if ((stops.length * gap) > availableHeight) {
        gap = availableHeight / (stops.length - 1);
    }

    doc.setDrawColor(lineColor);
    doc.setLineWidth(3.5); 
    doc.line(xLine, startY, xLine, startY + ((stops.length - 1) * gap));

    stops.forEach((stop, index) => {
        let yPos = startY + (index * gap);
        let radius = (index === 0 || index === stops.length - 1) ? 3 : 1.5; 
        
        doc.setFillColor(255, 255, 255);
        doc.setDrawColor(lineColor);
        doc.setLineWidth(1.5);
        doc.circle(xLine, yPos, radius, 'FD');
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(stop, xLine + 12, yPos, { baseline: 'middle' });

        if(corres[index] && !useCustomIcons) {
            let lines = corres[index].split(',').map(s => s.trim());
            let xCor = xLine + 100; 
            lines.forEach(l => {
                if(!l) return;
                let bubbleColor = getCorresColor(l);
                doc.setFillColor(bubbleColor); 
                doc.circle(xCor, yPos, 3.5, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(7);
                doc.setFont("helvetica", "bold");
                doc.text(l, xCor, yPos, { align: 'center', baseline: 'middle' });
                xCor += 9;
            });
        }
    });

    // --- SCHEDULES ---
    doc.addPage();
    drawHeader(doc, networkName, "Horaires", lineColor);
    let currentY = 30; // START HIGHER

    generateAll(); // Refresh HTML
    
    const days = [ {id:'semaine', t:'Lundi-Vendredi'}, {id:'samedi', t:'Samedi'}, {id:'dimanche', t:'Dimanche'} ];

    days.forEach(day => {
        const container = document.getElementById('res-' + day.id);
        const titles = container.getElementsByTagName('h4');
        const tables = container.getElementsByTagName('table');
        
        for(let i=0; i<tables.length; i++) {
            let table = tables[i];
            let title = `${day.t} - ${titles[i] ? titles[i].innerText : ""}`;

            // Check if space left (approx 50 units for header + 1 row)
            if (currentY + 50 > 280) { 
                doc.addPage();
                drawHeader(doc, networkName, "Horaires", lineColor);
                currentY = 30; 
            }

            doc.setTextColor(0,0,0);
            doc.setFontSize(12);
            doc.text(title, 14, currentY);

            doc.autoTable({
                html: table,
                startY: currentY + 5,
                theme: 'grid',
                headStyles: { fillColor: lineColor, textColor: 255, fontSize: 8 },
                bodyStyles: { fontSize: 7, cellPadding: 1 },
                styles: { overflow: 'linebreak' },
                margin: { bottom: 15 }
            });

            currentY = doc.lastAutoTable.finalY + 12; // REDUCED MARGIN
        }
    });

    doc.save(`Fiche_${networkName}_${lineNameText}.pdf`);
}
