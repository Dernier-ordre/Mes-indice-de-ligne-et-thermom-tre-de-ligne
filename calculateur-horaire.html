<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de fiche horraire</title>
    <style>
        :root { --primary: #1e272e; --accent: #05c46b; --tm-blue: #3c40c6; --bg: #f1f2f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        
        /* HEADER AVEC CHOIX DU NIVEAU */
        .header-nav { 
            background: var(--primary); color: white; padding: 25px; border-radius: 15px; 
            margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: end;
        }
        .header-nav h2 { margin: 0; grid-column: 1 / -1; color: var(--accent); font-size: 1.5em; text-transform: uppercase; letter-spacing: 1px; }

        /* DESIGN DES CARTES */
        .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid var(--bg); font-size: 1.1em; color: var(--primary); }

        /* FORMULAIRES */
        label { display: block; font-size: 0.85em; font-weight: bold; margin: 10px 0 5px; color: #485460; }
        select, input { width: 100%; padding: 12px; border: 2px solid #efefef; border-radius: 8px; box-sizing: border-box; font-size: 1em; }
        select:focus, input:focus { border-color: var(--tm-blue); outline: none; }

        /* NOM DES ARRÊTS */
        .stops-list { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 250px; overflow-y: auto; margin-top: 10px; padding: 5px; background: #f9f9f9; border-radius: 8px; }
        .stop-item { display: flex; align-items: center; gap: 5px; }
        .stop-item span { font-size: 0.8em; color: #888; min-width: 25px; }

        /* PÉRIODES */
        .period-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid var(--tm-blue); margin-bottom: 15px; position: relative; }
        .period-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: #ff5e57; color: white; border: none; border-radius: 50%; cursor: pointer; width: 22px; height: 22px; }

        /* BOUTONS ACTIONS */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; flex: 1; text-transform: uppercase; }
        .btn-calc { background: var(--accent); color: white; }
        .btn-add { background: var(--tm-blue); color: white; margin-top: 10px; }
        .btn-excel { background: #1e272e; color: white; margin-bottom: 15px; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* TABLEAUX */
        .table-container { overflow-x: auto; background: white; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; min-width: 80px; }
        
        /* Colonne Arrêts Fixe */
        th:first-child, td:first-child { position: sticky; left: 0; background: #f8f9fa; z-index: 10; border-right: 3px solid var(--primary); min-width: 160px; text-align: left; }
        th { background: var(--primary); color: white; }
        
        /* Badges Véhicules et Intervalles */
        .course-info { display: flex; flex-direction: column; font-size: 0.75em; }
        .badge-vh { background: #ffa801; color: #000; padding: 2px 4px; border-radius: 4px; font-weight: bold; margin: 3px 0; }
        .badge-int { color: #aaa; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-nav">
        <h2>Configuration Rapide (Données Transport Manager)</h2>
        <div>
            <label style="color:white;">1. Choisir ton Niveau</label>
            <select id="lvl-select" onchange="loadLines()">
                <option value="">-- Sélectionner --</option>
                <option value="1">Niveau 1</option>
                <option value="2">Niveau 2</option>
                <option value="3">Niveau 3</option>
                <option value="4">Niveau 4</option>
                <option value="5">Niveau 5</option>
            </select>
        </div>
        <div>
            <label style="color:white;">2. Choisir la Ligne</label>
            <select id="line-select" onchange="applyLine()">
                <option value="">-- En attente du niveau --</option>
            </select>
        </div>
        <div style="font-size: 0.8em; color: #ccc;">
            ℹ️ Sélectionner une ligne remplit automatiquement le temps de trajet moyen.
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>Paramètres de la Ligne</h3>
            <label>Temps Aller-Retour (min)</label>
            <input type="number" id="totalTime" value="45">
            
            <label>Pause Terminus (Total min)</label>
            <input type="number" id="breakTime" value="15">
            
            <label>Nombre d'arrêts</label>
            <input type="number" id="nbStops" value="10" oninput="uiStops()">

            <label>Nommer vos arrêts</label>
            <div id="stop-list" class="stops-list"></div>
        </div>

        <div class="card">
            <h3>Planification des Services</h3>
            <div id="periods-container"></div>
            <button class="btn btn-add" onclick="addPeriod()">+ Ajouter une plage horaire</button>

            <div class="btn-group">
                <button class="btn btn-calc" onclick="generate()">Générer les Fiches Horaires</button>
            </div>
        </div>
    </div>

    <div id="results" style="display:none; margin-top: 30px;">
        <button class="btn btn-excel" onclick="exportExcel()">📥 Exporter vers Excel (.xls)</button>
        
        <h3 style="color:var(--tm-blue)">⬆ DIRECTION : ALLER (Terminus A vers B)</h3>
        <div class="table-container"><table id="table-aller"></table></div>

        <h3 style="color:#e67e22">⬇ DIRECTION : RETOUR (Terminus B vers A)</h3>
        <div class="table-container"><table id="table-retour"></table></div>
    </div>
</div>

<script>
// --- DONNÉES DE CONFIGURATION TM ---
const tmData = {
    "1": [{n:"Ligne 1", t:48}, {n:"Ligne 2", t:80}, {n:"Ligne 3", t:64}, {n:"Ligne 4", t:56}],
    "2": [{n:"Ligne 1", t:48}, {n:"Ligne 2", t:80}, {n:"Ligne 3", t:64}, {n:"Ligne 4", t:56}],
    "3": [{n:"Ligne 1", t:48}, {n:"Ligne 2", t:80}, {n:"Ligne 3", t:64}, {n:"Ligne 4", t:56}],
    "4": [{n:"Ligne 1", t:48}, {n:"Ligne 2", t:80}, {n:"Ligne 3", t:64}, {n:"Ligne 4", t:56}],
    "5": [{n:"Ligne 1", t:92}, {n:"Ligne 2", t:48}, {n:"Ligne 3", t:64}, {n:"Ligne 4", t:94}]
};

// --- GESTION INTERFACE ---
window.onload = () => {
    uiStops();
    addPeriod('06:00', '22:00', 4);
};

function loadLines() {
    const lvl = document.getElementById('lvl-select').value;
    const lSel = document.getElementById('line-select');
    lSel.innerHTML = '<option value="">-- Choisir une ligne --</option>';
    if(tmData[lvl]) {
        tmData[lvl].forEach(l => {
            lSel.innerHTML += `<option value="${l.t}">${l.n} (${l.t} min)</option>`;
        });
    }
}

function applyLine() {
    const time = document.getElementById('line-select').value;
    if(time) document.getElementById('totalTime').value = time;
}

function uiStops() {
    const n = document.getElementById('nbStops').value;
    const container = document.getElementById('stop-list');
    container.innerHTML = '';
    for(let i=1; i<=n; i++) {
        container.innerHTML += `
            <div class="stop-item">
                <span>${i}.</span>
                <input type="text" class="stop-name" placeholder="Nom arrêt ${i}" value="Arrêt ${i}">
            </div>`;
    }
}

function addPeriod(s='', e='', b='') {
    const cont = document.getElementById('periods-container');
    const div = document.createElement('div');
    div.className = 'period-box';
    div.innerHTML = `
        <button class="btn-del" onclick="this.parentElement.remove()">×</button>
        <div class="period-grid">
            <div><label>Début</label><input type="time" class="p-start" value="${s}"></div>
            <div><label>Fin</label><input type="time" class="p-end" value="${e}"></div>
            <div><label>Nb de Bus</label><input type="number" class="p-bus" value="${b}"></div>
        </div>
    `;
    cont.appendChild(div);
}

// --- CALCULS ---
function timeToMin(s) { const [h,m] = s.split(':').map(Number); return h*60+m; }
function minToTime(m) { 
    let h = Math.floor(m/60)%24; 
    let min = Math.floor(m%60); 
    return `${h.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`; 
}

function generate() {
    const arTime = parseInt(document.getElementById('totalTime').value);
    const pause = parseInt(document.getElementById('breakTime').value);
    const nbStops = parseInt(document.getElementById('nbStops').value);
    const stopNames = Array.from(document.querySelectorAll('.stop-name')).map(i => i.value);

    const cycle = arTime + pause;
    const oneWay = arTime / 2;
    const gap = oneWay / (nbStops - 1);
    const returnDelay = oneWay + (pause / 2);

    let periods = [];
    document.querySelectorAll('.period-box').forEach(p => {
        let s = timeToMin(p.querySelector('.p-start').value);
        let e = timeToMin(p.querySelector('.p-end').value);
        let b = parseInt(p.querySelector('.p-bus').value);
        if(e <= s) e += 1440;
        if(b > 0) periods.push({s, e, b});
    });
    periods.sort((a,b) => a.s - b.s);

    const makeTable = (isRetour) => {
        let rows = [];
        for(let i=0; i<nbStops; i++) {
            let name = isRetour ? stopNames[nbStops-1-i] : stopNames[i];
            rows[i] = `<tr><td>${name}</td>`;
        }

        let header = `<tr><th>Arrêts</th>`;
        let cur = periods[0].s;
        let end = periods[periods.length-1].e;
        let count = 1;

        while(cur < end) {
            let p = periods.find(p => cur >= p.s && cur < p.e);
            if(!p) {
                let next = periods.find(p => p.s > cur);
                if(next) { cur = next.s; continue; } else break;
            }

            let frequency = cycle / p.b;
            let vh = ((count-1) % p.b) + 1; // Calcul de la voiture

            header += `
                <th>
                    <div class="course-info">
                        <strong>C${count}</strong>
                        <span class="badge-vh">Voiture ${vh}</span>
                        <span class="badge-int">${Math.round(frequency)} min</span>
                    </div>
                </th>`;

            let base = isRetour ? cur + returnDelay : cur;
            for(let i=0; i<nbStops; i++) {
                rows[i] += `<td>${minToTime(Math.round(base + (i*gap)))}</td>`;
            }
            cur += frequency;
            count++;
        }
        return `<thead>${header}</tr></thead><tbody>${rows.join('</tr>')}</tbody>`;
    };

    document.getElementById('table-aller').innerHTML = makeTable(false);
    document.getElementById('table-retour').innerHTML = makeTable(true);
    document.getElementById('results').style.display = 'block';
}

function exportExcel() {
    let table = document.getElementById('results').innerHTML;
    let blob = new Blob([table], {type: 'application/vnd.ms-excel'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'SAEIV_Export.xls';
    a.click();
}
</script>

</body>
</html>
