<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCRR – Réservation Transport à la Demande</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --noir:      #0a0a0a;
    --noir-card: #111111;
    --rouge:     #c0000a;
    --rouge-vif: #e8000d;
    --rouge-sombre: #6b0005;
    --gris-fonce:#1c1c1c;
    --gris-bord: #2a2a2a;
    --gris-text: #888;
    --blanc:     #f0f0f0;
    --blanc-doux:#c8c8c8;
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: var(--noir);
    color: var(--blanc);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }
 
  /* ── HEADER ── */
  header {
    background: var(--noir-card);
    border-bottom: 3px solid var(--rouge);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 300px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(192,0,10,0.06));
    pointer-events: none;
  }
  .logo-box {
    background: #0a0a0a;
    border: 2px solid var(--rouge-sombre);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--rouge-vif), var(--rouge-sombre));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-info h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--blanc);
  }
  .header-info p {
    font-size: 0.78rem;
    color: var(--gris-text);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .badge-tad {
    margin-left: auto;
    background: var(--rouge);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 14px;
    text-transform: uppercase;
  }
 
  /* ── MAIN ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
 
  /* ── LIGNE SELECTOR ── */
  .ligne-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }
  .ligne-btn {
    background: var(--gris-fonce);
    border: 2px solid var(--gris-bord);
    color: var(--gris-text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 18px 12px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .ligne-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--rouge);
    transform: scaleY(0);
    transition: transform 0.2s;
  }
  .ligne-btn:hover { border-color: var(--rouge-sombre); color: var(--blanc-doux); }
  .ligne-btn.active {
    background: rgba(192,0,10,0.12);
    border-color: var(--rouge);
    color: var(--blanc);
  }
  .ligne-btn.active::before { transform: scaleY(1); }
  .ligne-btn .badge {
    display: inline-block;
    background: var(--rouge);
    color: #fff;
    font-size: 1.3rem;
    font-weight: 800;
    padding: 2px 10px;
    margin-right: 8px;
  }
  .ligne-btn.active .badge { background: var(--rouge-vif); }
  .ligne-btn .horaires-mini {
    display: block;
    font-size: 0.68rem;
    font-weight: 400;
    color: var(--gris-text);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .ligne-btn.active .horaires-mini { color: var(--blanc-doux); }
 
  /* ── SECTION TITRE ── */
  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rouge);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gris-bord);
  }
 
  /* ── FORM CARD ── */
  .form-card {
    background: var(--noir-card);
    border: 1px solid var(--gris-bord);
    border-top: 3px solid var(--rouge);
    padding: 28px;
    margin-bottom: 24px;
  }
 
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 24px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
 
  label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gris-text);
  }
 
  input, select {
    background: var(--gris-fonce);
    border: 1px solid var(--gris-bord);
    border-bottom: 2px solid var(--gris-bord);
    color: var(--blanc);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus {
    border-color: var(--rouge);
    background: #161616;
  }
  input::placeholder { color: #444; }
  select { cursor: pointer; }
  select option { background: #1c1c1c; }
 
  /* custom select arrow */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--rouge);
    pointer-events: none;
    font-size: 0.9rem;
  }
 
  /* ── BOUTON SUBMIT ── */
  .btn-reserver {
    width: 100%;
    background: var(--rouge);
    color: #fff;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .btn-reserver:hover { background: var(--rouge-vif); }
  .btn-reserver:active { transform: scale(0.99); }
  .btn-reserver:disabled { background: #333; color: #555; cursor: not-allowed; }
 
  /* ── ALERTE ── */
  .alerte {
    display: none;
    background: rgba(192,0,10,0.12);
    border-left: 4px solid var(--rouge);
    padding: 12px 16px;
    font-size: 0.85rem;
    color: #ff6e72;
    margin-top: 12px;
    font-family: 'Barlow', sans-serif;
  }
  .alerte.visible { display: block; }
 
  /* ── RESERVATIONS LIST ── */
  #reservations-section { display: none; }
  #reservations-section.visible { display: block; }
 
  .resa-list { display: flex; flex-direction: column; gap: 12px; }
 
  .resa-ticket {
    background: var(--gris-fonce);
    border: 1px solid var(--gris-bord);
    border-left: 5px solid var(--rouge);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  .resa-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--rouge);
    text-align: center;
  }
  .resa-num .num {
    display: block;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--blanc-doux);
    line-height: 1;
  }
 
  .resa-body { }
  .resa-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .resa-ligne-badge {
    background: var(--rouge);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    padding: 2px 10px;
    letter-spacing: 1px;
  }
  .resa-passager {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--blanc);
    text-transform: uppercase;
  }
 
  .resa-trajet {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--blanc-doux);
    flex-wrap: wrap;
  }
  .resa-trajet .arret { font-weight: 500; }
  .resa-trajet .fleche { color: var(--rouge); font-size: 0.75rem; }
 
  .resa-meta {
    text-align: right;
    font-size: 0.78rem;
    color: var(--gris-text);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
  }
  .resa-meta .heure {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--blanc);
    display: block;
    line-height: 1;
  }
  .resa-meta .pax { color: var(--rouge); font-weight: 600; }
 
  .btn-suppr {
    background: none;
    border: 1px solid #333;
    color: #555;
    font-size: 0.8rem;
    padding: 4px 8px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    margin-top: 6px;
    transition: all 0.2s;
    float: right;
  }
  .btn-suppr:hover { border-color: var(--rouge); color: var(--rouge); }
 
  /* ── INFO HORAIRES ── */
  .horaires-info {
    background: rgba(192,0,10,0.05);
    border: 1px solid var(--rouge-sombre);
    padding: 14px 18px;
    margin-bottom: 24px;
    display: none;
  }
  .horaires-info.visible { display: block; }
  .horaires-info h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rouge);
    margin-bottom: 8px;
  }
  .horaires-info table { width: 100%; font-size: 0.82rem; }
  .horaires-info td { padding: 3px 8px; color: var(--blanc-doux); }
  .horaires-info td:first-child { color: var(--gris-text); font-weight: 500; width: 130px; }
  .horaires-info .fermee { color: #555; font-style: italic; }
 
  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #333;
    border-top: 1px solid var(--gris-bord);
  }
 
  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    main { padding: 24px 12px 40px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .resa-ticket { grid-template-columns: auto 1fr; }
    .resa-meta { display: none; }
    .ligne-selector { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
 
<header>
  <div class="logo-box">
    <span class="logo-text">TCR</span>
  </div>
  <div class="header-info">
    <h1>Transport à la Demande</h1>
    <p>Réservation en ligne — Lignes R1 &amp; R2</p>
  </div>
  <div class="badge-tad">TAD</div>
</header>
 
<main>
 
  <!-- Sélection ligne -->
  <div class="section-label">Choisissez votre ligne</div>
  <div class="ligne-selector">
    <button class="ligne-btn" id="btn-r1" onclick="selectLigne('R1')">
      <span class="badge">R1</span> Fort de Feyzin ↔ Surville
      <span class="horaires-mini">Lun–Ven : 7h–9h30 / 16h–19h &nbsp;|&nbsp; Sam–Dim : 10h–18h</span>
    </button>
    <button class="ligne-btn" id="btn-r2" onclick="selectLigne('R2')">
      <span class="badge">R2</span> Parc Tête d'Or ↔ Miribel Jonage
      <span class="horaires-mini">Lun–Ven : 6h–22h &nbsp;|&nbsp; Sam : 10h–22h &nbsp;|&nbsp; Dim : fermée</span>
    </button>
  </div>
 
  <!-- Infos horaires dynamiques -->
  <div class="horaires-info" id="horaires-info">
    <h3>⏱ Plages horaires de la ligne <span id="hl-nom"></span></h3>
    <table id="hl-table"></table>
  </div>
 
  <!-- Formulaire -->
  <div class="section-label">Informations du trajet</div>
  <div class="form-card">
    <div class="form-grid">
 
      <div class="form-group">
        <label for="nom">Nom / Pseudo du passager</label>
        <input type="text" id="nom" placeholder="Ex : JeanDupont42" autocomplete="off" maxlength="40">
      </div>
 
      <div class="form-group">
        <label for="nb-pax">Nombre de passagers</label>
        <div class="select-wrap">
          <select id="nb-pax">
            <option value="">— Sélectionner —</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
          </select>
        </div>
      </div>
 
      <div class="form-group">
        <label for="depart">Arrêt de départ</label>
        <div class="select-wrap">
          <select id="depart" onchange="updateArrivee()">
            <option value="">— Choisir une ligne d'abord —</option>
          </select>
        </div>
      </div>
 
      <div class="form-group">
        <label for="arrivee">Arrêt d'arrivée</label>
        <div class="select-wrap">
          <select id="arrivee">
            <option value="">— Choisir un départ d'abord —</option>
          </select>
        </div>
      </div>
 
      <div class="form-group">
        <label for="date">Date du trajet</label>
        <input type="date" id="date" onchange="updateHeures()">
      </div>
 
      <div class="form-group">
        <label for="heure">Heure souhaitée</label>
        <div class="select-wrap">
          <select id="heure">
            <option value="">— Choisir une date d'abord —</option>
          </select>
        </div>
      </div>
 
    </div><!-- /form-grid -->
 
    <div class="alerte" id="alerte"></div>
 
    <button class="btn-reserver" id="btn-submit" onclick="soumettre()" disabled>
      ▶ Confirmer la réservation
    </button>
  </div>
 
  <!-- Liste des réservations -->
  <div id="reservations-section">
    <div class="section-label">Réservations enregistrées</div>
    <div class="resa-list" id="resa-list"></div>
  </div>
 
</main>
 
<footer>TCRR &nbsp;·&nbsp; Transport à la Demande &nbsp;·&nbsp; Réservation en ligne</footer>
 
<script>
// ── DONNÉES LIGNES ──────────────────────────────────────────────
const LIGNES = {
  R1: {
    nom: 'R1',
    arrets: [
      'FORT DE FEYZIN',
      'Arrêt R1 – 02 *(à renommer)*',
      'Arrêt R1 – 03 *(à renommer)*',
      'Arrêt R1 – 04 *(à renommer)*',
      'Arrêt R1 – 05 *(à renommer)*',
      'Arrêt R1 – 06 *(à renommer)*',
      'Arrêt R1 – 07 *(à renommer)*',
      'Arrêt R1 – 08 *(à renommer)*',
      'Arrêt R1 – 09 *(à renommer)*',
      'SURVILLE – ROUTE DE VIENNE'
    ],
    // horaires [début, fin] ou null si fermé. Index 0=Lun ... 6=Dim
    horaires: {
      // { tranches: [[h_debut_min, h_fin_min], ...] } ou null
      0: { tranches: [[420,570],[960,1140]] },   // Lun  7h-9h30 / 16h-19h
      1: { tranches: [[420,570],[960,1140]] },   // Mar
      2: { tranches: [[420,570],[960,1140]] },   // Mer
      3: { tranches: [[420,570],[960,1140]] },   // Jeu
      4: { tranches: [[420,570],[960,1140]] },   // Ven
      5: { tranches: [[600,1080]] },             // Sam  10h-18h
      6: { tranches: [[600,1080]] }              // Dim  10h-18h
    }
  },
  R2: {
    nom: 'R2',
    arrets: [
      'PARC TÊTE D\'OR – CHURCHILL',
      'Arrêt R2 – 02 *(à renommer)*',
      'Arrêt R2 – 03 *(à renommer)*',
      'Arrêt R2 – 04 *(à renommer)*',
      'Arrêt R2 – 05 *(à renommer)*',
      'Arrêt R2 – 06 *(à renommer)*',
      'Arrêt R2 – 07 *(à renommer)*',
      'Arrêt R2 – 08 *(à renommer)*',
      'Arrêt R2 – 09 *(à renommer)*',
      'Arrêt R2 – 10 *(à renommer)*',
      'Arrêt R2 – 11 *(à renommer)*',
      'Arrêt R2 – 12 *(à renommer)*',
      'Arrêt R2 – 13 *(à renommer)*',
      'Arrêt R2 – 14 *(à renommer)*',
      'Arrêt R2 – 15 *(à renommer)*',
      'Arrêt R2 – 16 *(à renommer)*',
      'GRAND PARC MIRIBEL JONAGE'
    ],
    horaires: {
      0: { tranches: [[360,1320]] },  // Lun  6h-22h
      1: { tranches: [[360,1320]] },  // Mar
      2: { tranches: [[360,1320]] },  // Mer
      3: { tranches: [[360,1320]] },  // Jeu
      4: { tranches: [[360,1320]] },  // Ven
      5: { tranches: [[600,1320]] },  // Sam  10h-22h
      6: null                          // Dim  fermée
    }
  }
};
 
// ── ÉTAT ───────────────────────────────────────────────────────
let ligneActive = null;
let reservations = [];
let resaCount = 0;
 
// ── SÉLECTION LIGNE ────────────────────────────────────────────
function selectLigne(code) {
  ligneActive = code;
  document.getElementById('btn-r1').classList.toggle('active', code === 'R1');
  document.getElementById('btn-r2').classList.toggle('active', code === 'R2');
 
  const ligne = LIGNES[code];
 
  // Horaires info
  const info = document.getElementById('horaires-info');
  info.classList.add('visible');
  document.getElementById('hl-nom').textContent = code;
  const jours = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  let rows = '';
  jours.forEach((j, i) => {
    const h = ligne.horaires[i];
    if (!h) {
      rows += `<tr><td>${j}</td><td class="fermee">Ligne fermée</td></tr>`;
    } else {
      const str = h.tranches.map(t => `${minToHHMM(t[0])} – ${minToHHMM(t[1])}`).join(' &nbsp;/&nbsp; ');
      rows += `<tr><td>${j}</td><td>${str}</td></tr>`;
    }
  });
  document.getElementById('hl-table').innerHTML = rows;
 
  // Arrêts départ
  const sel = document.getElementById('depart');
  sel.innerHTML = '<option value="">— Sélectionner un arrêt —</option>';
  ligne.arrets.forEach((a, i) => {
    if (i < ligne.arrets.length - 1) {
      sel.innerHTML += `<option value="${i}">${a}</option>`;
    }
  });
  document.getElementById('arrivee').innerHTML = '<option value="">— Choisir un départ d\'abord —</option>';
 
  // Reset heures
  document.getElementById('heure').innerHTML = '<option value="">— Choisir une date d\'abord —</option>';
  document.getElementById('date').value = '';
 
  // Bornes de date
  setDateBornes();
  validerFormulaire();
}
 
// ── DATE BORNES ────────────────────────────────────────────────
function setDateBornes() {
  const dateInput = document.getElementById('date');
  const now = new Date();
  const min = new Date(now.getTime() + 24 * 3600 * 1000);
  const max = new Date(now.getTime() + 60 * 24 * 3600 * 1000);
  dateInput.min = toISO(min);
  dateInput.max = toISO(max);
}
 
function toISO(d) {
  return d.toISOString().split('T')[0];
}
 
// ── ARRÊT ARRIVÉE ──────────────────────────────────────────────
function updateArrivee() {
  if (!ligneActive) return;
  const ligne = LIGNES[ligneActive];
  const depIdx = parseInt(document.getElementById('depart').value);
  const sel = document.getElementById('arrivee');
  sel.innerHTML = '<option value="">— Sélectionner un arrêt —</option>';
  if (isNaN(depIdx)) return;
  ligne.arrets.forEach((a, i) => {
    if (i > depIdx) sel.innerHTML += `<option value="${i}">${a}</option>`;
  });
  updateHeures();
  validerFormulaire();
}
 
// ── CRÉNEAUX HORAIRES ──────────────────────────────────────────
function updateHeures() {
  if (!ligneActive) return;
  const dateVal = document.getElementById('date').value;
  if (!dateVal) return;
 
  const ligne = LIGNES[ligneActive];
  const jourIdx = new Date(dateVal + 'T12:00:00').getDay(); // 0=Dim, 1=Lun...
  const jourLigne = jourIdx === 0 ? 6 : jourIdx - 1; // convertir en 0=Lun...6=Dim
 
  const hSel = document.getElementById('heure');
  const horaire = ligne.horaires[jourLigne];
 
  if (!horaire) {
    hSel.innerHTML = '<option value="">Ligne fermée ce jour</option>';
    showAlerte('La ligne ' + ligneActive + ' ne circule pas ce jour-là.');
    validerFormulaire();
    return;
  }
 
  clearAlerte();
  hSel.innerHTML = '<option value="">— Sélectionner un créneau —</option>';
  horaire.tranches.forEach(t => {
    for (let m = t[0]; m <= t[1]; m += 15) {
      const hhmm = minToHHMM(m);
      hSel.innerHTML += `<option value="${hhmm}">${hhmm}</option>`;
    }
  });
  validerFormulaire();
}
 
function minToHHMM(m) {
  const hh = String(Math.floor(m / 60)).padStart(2, '0');
  const mm = String(m % 60).padStart(2, '0');
  return `${hh}h${mm}`;
}
 
// ── VALIDATION ────────────────────────────────────────────────
function validerFormulaire() {
  const ok = ligneActive &&
    document.getElementById('nom').value.trim() &&
    document.getElementById('nb-pax').value &&
    document.getElementById('depart').value !== '' &&
    document.getElementById('arrivee').value !== '' &&
    document.getElementById('date').value &&
    document.getElementById('heure').value;
  document.getElementById('btn-submit').disabled = !ok;
}
 
document.addEventListener('DOMContentLoaded', () => {
  ['nom','nb-pax','depart','arrivee','date','heure'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('change', validerFormulaire);
    el.addEventListener('input', validerFormulaire);
  });
  setDateBornes();
});
 
// ── SOUMISSION ────────────────────────────────────────────────
function soumettre() {
  const ligne = LIGNES[ligneActive];
  const depIdx = parseInt(document.getElementById('depart').value);
  const arrIdx = parseInt(document.getElementById('arrivee').value);
  const nom    = document.getElementById('nom').value.trim();
  const pax    = document.getElementById('nb-pax').value;
  const date   = document.getElementById('date').value;
  const heure  = document.getElementById('heure').value;
 
  resaCount++;
  const resa = {
    id: resaCount,
    ligne: ligneActive,
    nom, pax,
    depart:  ligne.arrets[depIdx],
    arrivee: ligne.arrets[arrIdx],
    date, heure
  };
  reservations.unshift(resa);
  afficherResas();
  resetFormulaire();
}
 
function afficherResas() {
  const sec = document.getElementById('reservations-section');
  const list = document.getElementById('resa-list');
  sec.classList.add('visible');
 
  list.innerHTML = '';
  reservations.forEach(r => {
    const dateF = new Date(r.date + 'T12:00:00')
      .toLocaleDateString('fr-FR', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
    list.innerHTML += `
      <div class="resa-ticket" id="resa-${r.id}">
        <div class="resa-num">N°<span class="num">${String(r.id).padStart(3,'0')}</span></div>
        <div class="resa-body">
          <div class="resa-top">
            <span class="resa-ligne-badge">${r.ligne}</span>
            <span class="resa-passager">${r.nom}</span>
          </div>
          <div class="resa-trajet">
            <span class="arret">${r.depart}</span>
            <span class="fleche">➜</span>
            <span class="arret">${r.arrivee}</span>
          </div>
          <div>${dateF}</div>
          <button class="btn-suppr" onclick="supprimerResa(${r.id})">✕ Supprimer</button>
        </div>
        <div class="resa-meta">
          <span class="heure">${r.heure}</span>
          <span class="pax">${r.pax} pax.</span>
        </div>
      </div>`;
  });
}
 
function supprimerResa(id) {
  reservations = reservations.filter(r => r.id !== id);
  if (reservations.length === 0) {
    document.getElementById('reservations-section').classList.remove('visible');
  } else {
    afficherResas();
  }
}
 
// ── RESET ──────────────────────────────────────────────────────
function resetFormulaire() {
  document.getElementById('nom').value = '';
  document.getElementById('nb-pax').value = '';
  document.getElementById('depart').value = '';
  document.getElementById('arrivee').innerHTML = '<option value="">— Choisir un départ d\'abord —</option>';
  document.getElementById('date').value = '';
  document.getElementById('heure').innerHTML = '<option value="">— Choisir une date d\'abord —</option>';
  document.getElementById('btn-submit').disabled = true;
}
 
function showAlerte(msg) {
  const a = document.getElementById('alerte');
  a.textContent = '⚠ ' + msg;
  a.classList.add('visible');
}
function clearAlerte() {
  document.getElementById('alerte').classList.remove('visible');
}
</script>
