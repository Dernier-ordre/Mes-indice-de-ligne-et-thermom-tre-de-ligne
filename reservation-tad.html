<div id="tad-wrapper" style="all: initial; display: block; font-family: 'Segoe UI', sans-serif;">
    <style>
        #tad-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; max-width: 800px; margin: 20px auto; border-top: 8px solid #737373; color: #333; }
        .tad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-ligne { flex: 1; cursor: pointer; border: 2px solid #eee; padding: 15px; border-radius: 12px; text-align: center; background: #fafafa; transition: 0.3s; }
        .btn-ligne.active { border-color: #737373; background: #f0f0f0; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px; box-sizing: border-box; }
        label { font-weight: bold; color: #737373; font-size: 14px; }
        #btn-submit { width: 100%; background: #737373; color: white; border: none; padding: 18px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
    </style>

    <div id="tad-card">
        <h2 style="text-align: center; margin-bottom: 25px;">Réserver mon trajet TAD</h2>
        
        <label>1. Sélectionnez votre ligne</label>
        <div style="display: flex; gap: 15px; margin: 10px 0 25px 0;">
            <div id="sel-R1" class="btn-ligne"><strong>Ligne R1</strong><br><small>10 arrêts</small></div>
            <div id="sel-R2" class="btn-ligne"><strong>Ligne R2</strong><br><small>17 arrêts</small></div>
        </div>

        <div id="tad-form-body" style="display: none;">
            <div class="tad-grid">
                <div><label>Départ</label><select id="dep-list"></select></div>
                <div><label>Arrivée</label><select id="arr-list"></select></div>
            </div>
            <div class="tad-grid">
                <div><label>Date</label><input type="date"></div>
                <div><label>Heure (15 min)</label><select id="time-list"></select></div>
            </div>
            <button id="btn-submit" type="button">CONFIRMER LA RÉSERVATION</button>
        </div>
    </div>
</div>

<script>
(function() {
    const config = {
        'R1': { stops: 10, start: 7, end: 20 },
        'R2': { stops: 17, start: 6, end: 22 }
    };

    const init = function() {
        const b1 = document.getElementById('sel-R1');
        const b2 = document.getElementById('sel-R2');
        const body = document.getElementById('tad-form-body');

        const update = function(id) {
            b1.classList.remove('active'); b2.classList.remove('active');
            document.getElementById('sel-' + id).classList.add('active');
            
            // Remplir arrêts
            const sD = document.getElementById('dep-list');
            const sA = document.getElementById('arr-list');
            sD.innerHTML = sA.innerHTML = '<option value="">Choisir...</option>';
            for(let i=1; i<=config[id].stops; i++) {
                let o = `<option>Arrêt ${id}-${i}</option>`;
                sD.innerHTML += o; sA.innerHTML += o;
            }

            // Remplir heures
            const sH = document.getElementById('time-list');
            sH.innerHTML = '<option value="">Choisir...</option>';
            for(let h=config[id].start; h<config[id].end; h++) {
                ['00','15','30','45'].forEach(m => {
                    let t = h + 'h' + m;
                    sH.innerHTML += `<option>${t}</option>`;
                });
            }
            body.style.display = 'block';
        };

        b1.onclick = () => update('R1');
        b2.onclick = () => update('R2');
        document.getElementById('btn-submit').onclick = () => alert('Demande envoyée !');
    };

    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);
})();
</script>
