<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation TAD</title>
    <style>
        :root { --main-color: #737373; --bg-color: #f4f4f4; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; display: flex; justify-content: center; }
        #tad-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; max-width: 500px; width: 100%; border-top: 8px solid var(--main-color); }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .label { font-weight: bold; color: var(--main-color); font-size: 14px; display: block; margin-bottom: 8px; }
        .line-selector { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-ligne { flex: 1; cursor: pointer; border: 2px solid #eee; padding: 15px; border-radius: 12px; text-align: center; background: #fafafa; transition: 0.3s; }
        .btn-ligne.active { border-color: var(--main-color); background: #f0f0f0; box-shadow: inset 0 0 5px rgba(0,0,0,0.1); }
        .btn-ligne strong { display: block; font-size: 1.1em; }
        .form-group { margin-bottom: 20px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        #btn-submit { width: 100%; background: var(--main-color); color: white; border: none; padding: 18px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        #btn-submit:hover { background: #555; }
        .info-bulle { font-size: 12px; color: #888; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div id="tad-card">
    <h2>Réserver mon TAD</h2>
    
    <span class="label">1. Choisissez votre ligne</span>
    <div class="line-selector">
        <div id="sel-R1" class="btn-ligne" onclick="selectLine('R1')"><strong>R1</strong><small>10 arrêts</small></div>
        <div id="sel-R2" class="btn-ligne" onclick="selectLine('R2')"><strong>R2</strong><small>17 arrêts</small></div>
    </div>

    <div id="tad-form-body" style="visibility: hidden; opacity: 0; transition: 0.5s;">
        <div class="form-group">
            <span class="label">Trajet</span>
            <div class="grid">
                <select id="dep-list"><option value="">Départ...</option></select>
                <select id="arr-list"><option value="">Arrivée...</option></select>
            </div>
        </div>

        <div class="form-group">
            <span class="label">Date du voyage</span>
            <input type="date" id="travel-date" onchange="updateHours()">
        </div>

        <div class="form-group">
            <span class="label">Horaire (Intervalle 15 min)</span>
            <select id="time-list">
                <option value="">Sélectionnez une date d'abord</option>
            </select>
            <div id="info-horaire" class="info-bulle"></div>
        </div>

        <button id="btn-submit" onclick="submitForm()">CONFIRMER LA RÉSERVATION</button>
    </div>
</div>

<script>
    let currentLine = '';
    const config = {
        'R1': { stops: 10 },
        'R2': { stops: 17 }
    };

    // Initialisation de la date (min = aujourd'hui)
    const dateInput = document.getElementById('travel-date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    function selectLine(id) {
        currentLine = id;
        document.getElementById('sel-R1').classList.remove('active');
        document.getElementById('sel-R2').classList.remove('active');
        document.getElementById('sel-' + id).classList.add('active');
        
        // Remplir les arrêts
        const sD = document.getElementById('dep-list');
        const sA = document.getElementById('arr-list');
        sD.innerHTML = sA.innerHTML = '<option value="">Choisir un arrêt...</option>';
        for(let i=1; i<=config[id].stops; i++) {
            let o = `<option value="Arrêt ${id}-${i}">Arrêt ${id}-${i}</option>`;
            sD.innerHTML += o; sA.innerHTML += o;
        }

        document.getElementById('tad-form-body').style.visibility = 'visible';
        document.getElementById('tad-form-body').style.opacity = '1';
        updateHours();
    }

    function updateHours() {
        if (!currentLine || !dateInput.value) return;

        const date = new Date(dateInput.value);
        const day = date.getDay(); // 0=Dimanche, 6=Samedi, 1-5=Semaine
        const isWeekend = (day === 0 || day === 6);
        const isSaturday = (day === 6);
        const sH = document.getElementById('time-list');
        const info = document.getElementById('info-horaire');
        sH.innerHTML = '';
        
        let ranges = [];

        if (currentLine === 'R1') {
            if (!isWeekend) {
                ranges = [{s: 7, e: 9.5}, {s: 16, e: 19}]; // 7h-9h30 et 16h-19h
                info.innerText = "Horaires semaine : 7h-9h30 / 16h-19h";
            } else {
                ranges = [{s: 10, e: 18}]; // 10h-18h
                info.innerText = "Horaires Weekend : 10h-18h";
            }
        } else { // Ligne R2
            if (!isWeekend) {
                ranges = [{s: 6, e: 22}]; // 6h-22h
                info.innerText = "Horaires semaine : 6h-22h";
            } else if (isSaturday) {
                ranges = [{s: 10, e: 22}]; // 10h-22h
                info.innerText = "Horaires Samedi : 10h-22h";
            } else {
                sH.innerHTML = '<option value="">Pas de service le dimanche</option>';
                info.innerText = "La ligne R2 ne circule pas le dimanche.";
                return;
            }
        }

        // Génération des options
        ranges.forEach(range => {
            for (let hour = range.s; hour < range.e; hour += 0.25) {
                let h = Math.floor(hour);
                let m = (hour % 1) * 60;
                let timeStr = h.toString().padStart(2, '0') + 'h' + m.toString().padStart(2, '0');
                sH.innerHTML += `<option value="${timeStr}">${timeStr}</option>`;
            }
        });
    }

    function submitForm() {
        const dep = document.getElementById('dep-list').value;
        const arr = document.getElementById('arr-list').value;
        const time = document.getElementById('time-list').value;

        if(!dep || !arr || !time) {
            alert("Veuillez remplir tous les champs.");
            return;
        }
        if(dep === arr) {
            alert("Le départ et l'arrivée doivent être différents.");
            return;
        }
        alert(`Réservation confirmée sur la ligne ${currentLine} !\nDépart: ${dep}\nArrivée: ${arr}\nHeure: ${time}`);
    }
</script>

</body>
</html>
